<script>
/*__ENGINE__*/

// ================= Состояние страницы =================
const app = { mode: null, game: null, P: null, offset: 0, myPeer: null, room: null, gameRoom: null, code: null, seq: 0, lastSeq: {}, hostSeen: false, me: null, tab: 'cards', sheet: null, hashCode: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (v) => `${v} €`;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('ib_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('ib_' + k, JSON.stringify(v)); } catch (e) { /* без хранилища */ } },
  del(k) { try { localStorage.removeItem('ib_' + k); } catch (e) { /* без хранилища */ } },
};
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
// ---------- Звуки (включаются после первого нажатия) ----------
let actx;
function tone(f, d = 0.12, type = 'sine', vol = 0.12, delay = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) { /* без звука */ }
}
function noise(d = 0.05, vol = 0.18, delay = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(actx.sampleRate * d), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1800; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(actx.destination); src.start(actx.currentTime + delay);
  } catch (e) { /* без звука */ }
}
const sfx = {
  dice: () => { for (let i = 0; i < 9; i++) noise(0.04, 0.2, i * 0.13 + Math.random() * 0.05); },

  if (k === 'join') { const e = G.join(String(d), peer, self); if (e && self) toast(e); return; }

  const n = PLAYERS.find((x) => G.pl[x].peer === peer && G.pl[x].on);
  if (!n) return;

  switch (k) {

    case 'roll': G.roll(n); break;
    case 'payJail': G.payJail(n); break;
    case 'jailCard': G.useJailCard(n); break;
    case 'buy': G.buy(n); break;
    case 'decline': G.decline(n); break;
    case 'pass': G.pass(n); break;
    case 'casinoBet': G.casinoBet(n, d?.amt, d?.on); break;
    case 'casinoSkip': G.casinoSkip(n); break;

    const mine = ch.peers.find((p) => p.sameTab);

    if (app.mode === 'host') {
      if (app.myPeer) for (const n of PLAYERS) if (app.game.pl[n].peer === 'host') app.game.pl[n].peer = app.myPeer;
      for (const p of [...ch.joined, ...ch.updated]) {

        const a = p.presence?.a;
        if (a && typeof a.n === 'number' && a.n > (app.lastSeq[p.peer] || 0)) { app.lastSeq[p.peer] = a.n; hostAct(p.peer, String(a.k), a.d, false); }

}

  const pinchInfo = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };

      const now = Date.now();

  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', (e) => { e.preventDefault(); if (T3.busy) return; ORB.zoom *= Math.exp(-e.deltaY * 0.0015); applyOrbit(); }, { passive: false });

// ---------- Рулетка ----------
function drawWheel(cv) {
  const x = cv.getContext('2d'), R = cv.width / 2, n = WHEEL.length, a = (Math.PI * 2) / n;
  x.clearRect(0, 0, cv.width, cv.height);
  x.save(); x.translate(R, R);
  x.fillStyle = '#5b3a1e'; x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.fill();
  for (let i = 0; i < n; i++) {
    const v = WHEEL[i], c = rouletteColor(v);
    x.fillStyle = c === 'zero' ? '#1b7a3d' : c === 'red' ? '#c62828' : '#151515';
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R * 0.92, -Math.PI / 2 + (i - 0.5) * a, -Math.PI / 2 + (i + 0.5) * a); x.closePath(); x.fill();
    x.strokeStyle = '#d4af37'; x.lineWidth = 2; x.stroke();
    x.save(); x.rotate(i * a); x.fillStyle = '#fff'; x.font = `bold ${Math.round(R * 0.075)}px sans-serif`; x.textAlign = 'center'; x.fillText(String(v), 0, -R * 0.8); x.restore();
  }
  x.fillStyle = '#3a2410'; x.beginPath(); x.arc(0, 0, R * 0.55, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#d4af37'; x.beginPath(); x.arc(0, 0, R * 0.12, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#ffc93c'; x.font = `${Math.round(R * 0.14)}px "Russo One", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('КАЗИНО', 0, R * 0.3);
  x.restore();
}
async function playRoulette(e) {
  const box = $('#roulette'), cv = box.querySelector('canvas'), ball = box.querySelector('.ball');
  drawWheel(cv);
  box.hidden = false;
  const names = { red: '🔴 красное', black: '⚫ чёрное', zero: '🟢 зеро' };
  setBanner(`🎰 ${esc(e.who)}: ${e.amt} € на ${names[e.on]}`);
  const idx = WHEEL.indexOf(e.r), a = 360 / WHEEL.length;
  const target = 360 * 5 - idx * a; // ячейка с выпавшим числом встаёт под указатель
  const r = cv.getBoundingClientRect().width / 2;
  for (let i = 0; i < 10; i++) noise(0.03, 0.1, i * 0.25 + i * i * 0.02);
  await tween(4200, (k) => {
    const e2 = 1 - Math.pow(1 - k, 3);
    cv.style.transform = `rotate(${target * e2}deg)`;
    // шарик бежит навстречу и опускается к ячейкам
    const ang = (-90 - 360 * 7 * (1 - e2)) * Math.PI / 180, rad = r * (0.86 - 0.07 * e2);
    ball.style.transform = `translate(${Math.cos(ang) * rad}px, ${Math.sin(ang) * rad}px)`;
  });
  const c = rouletteColor(e.r), won = e.net > 0;
  if (won) { sfx.buy(); shownMoney(e.who, e.net); flashChip(e.who, true); confetti(e.on === 'zero' ? 220 : 110); } else { sfx.thud(); shownMoney(e.who, e.net); flashChip(e.who, false); }
  setBanner(`${c === 'zero' ? '🟢' : c === 'red' ? '🔴' : '⚫'} ${e.r} — ${won ? `<span class="plus">${esc(e.who)} выигрывает +${e.net} €!</span>` : `<span class="minus">${esc(e.who)} проигрывает ${e.amt} €</span>`}`, true);
  await sleep(2200);
  setBanner('');
  box.hidden = true;
  cv.style.transform = '';
}

    case 'gain':

      setBanner(`${esc(e.who)} <span class="plus">+${e.amt} €</span>${e.why === 'Старт' ? ' за Старт' : ''}`);
      await Promise.all([coinShower(tokenPos(e.who), Math.min(18, 6 + Math.round(e.amt / 20))), sleep(1300)]); setBanner(''); break;
    case 'pay':

      setBanner(`${esc(e.from)} <span class="minus">−${e.amt} €</span>${e.to ? ' → ' + esc(e.to) : ''}${e.why ? ' · ' + esc(e.why) : ''}`);
      await Promise.all([coinsFly(tokenPos(e.from), e.to ? tokenPos(e.to) : new THREE.Vector3(0, 0, 0), Math.min(12, 3 + Math.round(e.amt / 25))), sleep(1500)]); setBanner(''); break;

      if (S) { S.own = { ...S.own, [e.c]: { o: e.who, h: 0, m: 0 } }; placeTokens(); }

const EVQ = { last: 0, q: [], busy: false, started: false };

    try { await playEvent(EVQ.q.shift()); } catch (err) { console.error(err); }
  }
  EVQ.busy = false; T3.busy = false; EVQ.actor = null; EVQ.what = null;

function placeTokens() {
  const V = view();
  if (!T3.ok || !V) return;
  for (const n of PLAYERS) {
    const t = T3.tokens[n], p = V.pl[n];
    t.visible = V.ph !== 'lobby' && V.order.includes(n) && !p.out;
    if (!T3.busy) t.position.copy(tokenSpot(n, T3.animPos[n] ?? p.pos));
  }
  T3.dirty = true;
  const curP = V.ph === 'play' ? V.order[V.turn] : null;
  if (T3.ring) {
    T3.ring.visible = !!curP && !T3.busy && !V.pl[curP]?.out;
    if (curP) { const sp = tokenSpot(curP, T3.animPos[curP] ?? V.pl[curP].pos); T3.ring.position.set(sp.x, 0.02, sp.z); T3.ring.material.color.set(PCOLORS[curP]); }
  }
  const prevH = T3.prevH || null; T3.prevH = {};
  // дома, отели и владельцы
  T3.extras.clear();
  const houseGeo = new THREE.BoxGeometry(0.13, 0.12, 0.13), hotelGeo = new THREE.BoxGeometry(0.34, 0.16, 0.16);
  const houseMat = new THREE.MeshStandardMaterial({ color: '#1f9d4a', roughness: .5 }), hotelMat = new THREE.MeshStandardMaterial({ color: '#d32f2f', roughness: .5 });
  for (const c in V.own) {
    const o = V.own[c], r = cellRect(+c), ctr = cellCenter(+c);
    const along = r.side % 2 === 0 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);
    const inward = [new THREE.Vector3(0, 0, -1), new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1), new THREE.Vector3(-1, 0, 0)][r.side];
    const depth = r.side % 2 === 0 ? r.h : r.w;
    const bandC = new THREE.Vector3(ctr.x, 0, ctr.z).addScaledVector(inward, depth / 2 - depth * 0.1);
    const outer = new THREE.Vector3(ctr.x, 0.006, ctr.z).addScaledVector(inward, -depth / 2 + 0.05);
    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(r.side % 2 === 0 ? r.w * 0.9 : 0.08, r.side % 2 === 0 ? 0.08 : r.h * 0.9),
      new THREE.MeshBasicMaterial({ color: PCOLORS[o.o], transparent: true, opacity: o.m ? 0.3 : 1 }));
    stripe.rotation.x = -Math.PI / 2; stripe.position.copy(outer);
    T3.extras.add(stripe);

    const drop = (m, y) => { if (!fresh) { m.position.y = y; return; } m.position.y = y + 2.5; tween(700, (k) => { const b = k < 0.7 ? (k / 0.7) ** 2 : 1 - Math.sin((k - 0.7) / 0.3 * Math.PI) * 0.12; m.position.y = y + 2.5 * (1 - b); }).then(() => { m.position.y = y; sfx.thud(); }); };
    if (o.h === 5) { const m = new THREE.Mesh(hotelGeo, hotelMat); m.castShadow = true; m.position.copy(bandC); drop(m, 0.08); if (r.side % 2) m.rotation.y = Math.PI / 2; T3.extras.add(m); }
    else for (let j = 0; j < o.h; j++) { const m = new THREE.Mesh(houseGeo, houseMat); m.castShadow = true; m.position.copy(bandC).addScaledVector(along, (j - (o.h - 1) / 2) * 0.17); if (fresh && j >= (prevH[c] || 0)) drop(m, 0.06); else m.position.y = 0.06; T3.extras.add(m); }
  }
}

function cardBox(card) {

// Можно ли сейчас где-нибудь построить дом
function canBuildAny(V, me) {
  if (!me || V.ph !== 'play') return false;
  return Object.keys(V.own).some((c) => !R.canBuild(V.s, me, Number(c)));
}
function dockHtml(V, me) {

    <button data-sh="trade" ${!me || V.pl[me]?.out || V.ph !== 'play' ? 'disabled' : ''}><span class="ic">🤝</span>Сделка</button>
    <button data-sh="log"><span class="ic">📜</span>Журнал</button>
    <button data-sh="menu"><span class="ic">⚙️</span>Меню</button></div>`;

const pline = (n, text) => `<div class="line"><span class="pdot" style="background:${PCOLORS[n]}"></span><span>${text}</span></div>`;
function offerRow(c, extra) {

}
function viewGame(V, me) {

function secsLeft(dl) { return Math.max(0, Math.ceil((dl - (Date.now() + app.offset)) / 1000)); }
setInterval(() => { const V = view(); if (V?.auc) document.querySelectorAll('[data-secs]').forEach((e) => { e.textContent = secsLeft(V.auc.dl); }); }, 250);

    const chk = (c, side) => `<label class="check"><input type="checkbox" data-tc="${side}" value="${c}" ${(s[side] || []).includes(c) ? 'checked' : ''}><span>${CELLS[c].e} ${esc(CELLS[c].s)}</span></label>`;
    html += `<h2>Сделка</h2>
      <div class="pnames">${others.map((n) => `<button data-tto="${esc(n)}" style="${n === to ? 'outline:3px solid var(--gold)' : ''}"><span class="dot" style="background:${PCOLORS[n]}"></span>${esc(n)}</button>`).join('')}</div>
      ${to ? `<div class="cols"><div><b>Ты отдаёшь</b>${mineC.map((c) => chk(c, 'gc')).join('') || '<span class="note">нет улиц</span>'}
          <input id="tgm" type="number" inputmode="numeric" min="0" placeholder="Деньги, €" value="${esc(s.gm ?? '')}">
          ${V.pl[me].jc ? `<input id="tgj" type="number" min="0" max="${V.pl[me].jc}" placeholder="Карты выхода" value="${esc(s.gj ?? '')}">` : ''}</div>
        <div><b>Получаешь (${esc(to)})</b>${theirC.map((c) => chk(c, 'rc')).join('') || '<span class="note">нет улиц</span>'}
          <input id="trm" type="number" inputmode="numeric" min="0" placeholder="Деньги, €" value="${esc(s.rm ?? '')}">
          ${V.pl[to].jc ? `<input id="trj" type="number" min="0" max="${V.pl[to].jc}" placeholder="Карты выхода" value="${esc(s.rj ?? '')}">` : ''}</div></div>
        <p class="note">У тебя ${eur(V.pl[me].money)}, у ${esc(to)} ${eur(V.pl[to].money)}</p>
        <button class="btn" data-a="sendTrade">Отправить предложение</button>` : '<p class="sub">Не с кем меняться</p>'}`;
  }
  box.innerHTML = html;
  $('#sheetWrap').hidden = false;
  const el = fid && document.getElementById(fid);
  if (el) { if (fval != null && 'value' in el) el.value = fval; el.focus(); }
  bindSheet();
}

// ---------- Обработчики ----------
const armed = {};
function confirmTwice(id, btn, label, fn) {
  if (armed[id]) { armed[id] = false; fn(); return; }
  armed[id] = true; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { armed[id] = false; if (btn.isConnected) btn.textContent = old; }, 3000);
}
const actions = {
  host: () => { store.del('host'); hostOnline(null); },
  resume: () => hostOnline(store.get('host')),
  join: () => joinOnline($('#code').value),
  exit: () => { closeSheet(); exitToMenu(); },
  copy: () => { const i = $('#invite'); navigator.clipboard?.writeText(i.value).then(() => toast('Ссылка скопирована'), () => { i.select(); toast('Выдели и скопируй ссылку'); }); },
  share: () => { if (navigator.share) navigator.share({ title: 'Иббенбюрен: наша команда', text: 'Заходи играть!', url: inviteUrl() }).catch(() => {}); else { $('#invite').select(); toast('Скопируй ссылку и отправь'); } },
  start: () => act('start'),
  roll: () => act('roll'),
  payJail: () => act('payJail'),
  jailCard: () => act('jailCard'),
  buy: () => act('buy'),
  decline: () => act('decline'),
  pass: () => act('pass'),
  casinoSkip: () => act('casinoSkip'),
  end: () => act('end'),
  skip: () => act('skip'),
  payDebt: () => act('payDebt'),
  bankrupt: (b) => confirmTwice('bk', b, 'Точно банкрот? Нажми ещё раз', () => act('bankrupt')),
  bid: () => { const v = Number($('#bidIn').value); if (!v) return toast('Впиши ставку'); act('bid', { v }); $('#bidIn').value = ''; },
  tradeYes: () => act('tradeYes'),
  tradeNo: () => act('tradeNo'),
  tradeCancel: () => act('tradeCancel'),
  newTrade: () => openSheet({ k: 'trade', gc: [], rc: [] }),
  toggleView: () => { if (T3.busy) return; T3.view = T3.view === 'top' ? 'tilt' : 'top'; ORB.pitch = T3.view === 'top' ? ORB_DEF.pitch : 0.95; animCam(topCam(), 600); closeSheet(); updateCamReset(); },
  hostEnd: (b) => confirmTwice('he', b, 'Точно закончить? Нажми ещё раз', () => { act('hostEnd'); closeSheet(); }),
  newGame: () => act('newGame'),
  sendTrade: () => {
    const s = app.sheet;
    const num = (id) => Number($('#' + id)?.value || 0);
    act('propose', { to: s.to, gc: s.gc || [], rc: s.rc || [], gm: num('tgm'), rm: num('trm'), gj: num('tgj'), rj: num('trj') });
    closeSheet(); toast('Предложение отправлено');
  },
};
function bindCommon(root) {
  root.querySelectorAll('[data-a]').forEach((b) => { const h = actions[b.dataset.a]; if (h) b.onclick = () => h(b); });
  root.querySelectorAll('[data-cell]').forEach((b) => b.onclick = () => openCell(Number(b.dataset.cell)));
}
function bindMain() {
  const m = $('#main');
  bindCommon(m);
  m.querySelectorAll('[data-join]').forEach((b) => b.onclick = () => { app.me = b.dataset.join; if (app.mode === 'client') { store.set('client', { code: app.code, me: app.me, at: Date.now() }); app.joinTried = true; } act('join', app.me); });
  m.querySelectorAll('[data-appr]').forEach((b) => b.onclick = () => act('approve', b.dataset.appr));
  m.querySelectorAll('[data-deny]').forEach((b) => b.onclick = () => act('deny', b.dataset.deny));
  m.querySelectorAll('[data-sh]').forEach((b) => b.onclick = () => { const k = b.dataset.sh; openSheet(k === 'trade' ? { k: 'trade', gc: [], rc: [] } : { k }); });
  m.querySelectorAll('[data-camt]').forEach((b) => b.onclick = () => { app.casinoAmt = Number(b.dataset.camt); renderPanel(true); });
  m.querySelectorAll('[data-con]').forEach((b) => b.onclick = () => { const V = view(); act('casinoBet', { amt: Math.min(app.casinoAmt || 50, CASINO_MAX, V.pl[myName()].money), on: b.dataset.con }); });
  m.querySelectorAll('[data-bid]').forEach((b) => b.onclick = () => act('bid', { v: Number(b.dataset.bid) }));
  const code = $('#code'); if (code) code.onkeydown = (e) => { if (e.key === 'Enter') joinOnline(code.value); };
}
function bindSheet() {
  const sh = $('#sheet');
  bindCommon(sh);
  sh.querySelectorAll('[data-close]').forEach((b) => b.onclick = closeSheet);
  sh.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(b.dataset.act, { c: Number(b.dataset.c) }));
  sh.querySelectorAll('[data-tto]').forEach((b) => b.onclick = () => { Object.assign(app.sheet, { to: b.dataset.tto, rc: [] }); renderSheet(); });
  sh.querySelectorAll('[data-tc]').forEach((b) => b.onchange = () => {
    const side = b.dataset.tc, c = Number(b.value), arr = app.sheet[side] || [];
    app.sheet[side] = b.checked ? [...new Set([...arr, c])] : arr.filter((x) => x !== c);
  });
  ['tgm', 'trm', 'tgj', 'trj'].forEach((id) => { const el = $('#' + id); if (el) el.oninput = () => { app.sheet[id.slice(1)] = el.value; }; });
}
$('#sheetWrap').addEventListener('click', (e) => { if (e.target.id === 'sheetWrap') closeSheet(); });

// ---------- Запуск ----------
(function boot() {
  const m = /^#g(\d{4,6})$/.exec(location.hash);
  if (m) app.hashCode = m[1];
  renderPanel(true);
  initRoom().then(() => {
    const cs = store.get('client');
    if (cs && cs.me && (!app.hashCode || cs.code === app.hashCode) && Date.now() - cs.at < 24 * 3600e3) app.me = cs.me;
    if (!app.mode && app.room && app.hashCode) {
      const hs = store.get('host');
      if (hs && hs.code === app.hashCode) hostOnline(hs); else joinOnline(app.hashCode);
    }
  });
})();
</script>

<script>// Связь между телефонами для версии на GitHub Pages: тот же интерфейс, что у «комнат» claude.ai
// (join → presence / onPeers / leave), но через публичный MQTT-брокер. Регистрация не нужна.
(function () {
  // Первый — на обычном порту 443 (проходит через большинство сетей), остальные — запасные
  const BROKERS = window.MG_BROKERS || [
    { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' },
    { url: 'wss://broker.emqx.io:8084/mqtt' },
    { url: 'wss://broker.hivemq.com:8884/mqtt' },
  ];
  const PREFIX = 'moyaigra-v1-k7q2/';
  const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  const me = rid();

  function connect(list, opts) {
    return new Promise((resolve, reject) => {
      let i = 0;
      const tryNext = () => {
        if (i >= list.length) return reject(new Error('no broker'));
        const b = typeof list[i] === 'string' ? { url: list[i] } : list[i];
        i += 1;
        const o = { ...opts };
        if (b.username) { o.username = b.username; o.password = b.password; }
        const c = window.mqtt.connect(b.url, o);
        const t = setTimeout(() => { c.end(true); tryNext(); }, 7000);
        c.once('connect', () => { clearTimeout(t); resolve(c); });
      };
      tryNext();
    });
  }

  async function join(name) {
    const base = PREFIX + name + '/p/';
    const myTopic = base + me;
    let mine = {};
    const peers = new Map();
    const handlers = [];
    let first = true, sched = false, left = false;
    let pend = { joined: [], left: [], updated: [] };
    const mk = (peer, presence) => Object.freeze({ peer, presence: Object.freeze(presence), sameTab: peer === me, isMe: peer === me, by: null, kind: 'viewer', guest: false, updatedAt: Date.now() });
    peers.set(me, mk(me, {}));

    function fire() {
      if (sched) return;
      sched = true;
      setTimeout(() => {
        sched = false;
        const all = [...peers.values()];
        const ch = first ? { peers: all, joined: all, left: [], updated: [] } : { peers: all, ...pend };
        first = false;
        pend = { joined: [], left: [], updated: [] };
        handlers.forEach((h) => { try { h(ch); } catch (e) { console.error(e); } });
      }, 10);
    }

    const client = await connect(BROKERS, {
      clientId: 'mg_' + me + '_' + rid().slice(0, 4),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 7000,
      will: { topic: myTopic, payload: '', retain: true, qos: 1 },
    });

    const announce = () => client.publish(myTopic, JSON.stringify(mine), { retain: true, qos: 1 });
    client.on('connect', () => { client.subscribe(base + '+', { qos: 1 }); announce(); });
    client.subscribe(base + '+', { qos: 1 });
    announce();

    client.on('message', (topic, buf) => {
      if (!topic.startsWith(base)) return;
      const peer = topic.slice(base.length);
      if (peer === me) return;
      const txt = buf.toString();
      if (!txt) {
        const o = peers.get(peer);
        if (o) { peers.delete(peer); pend.left.push(o); fire(); }
        return;
      }
      let pr;
      try { pr = JSON.parse(txt); } catch (e) { return; }
      if (!pr || typeof pr !== 'object') return;
      const had = peers.has(peer);
      const o = mk(peer, pr);
      peers.set(peer, o);
      (had ? pend.updated : pend.joined).push(o);
      fire();
    });

    const bye = () => { try { client.publish(myTopic, '', { retain: true, qos: 0 }); } catch (e) { /* закрываемся */ } };
    addEventListener('pagehide', bye);

    return {
      name,
      presence(patch) {
        if (left) return Promise.reject({ code: 'invalid_argument', message: 'left' });
        mine = { ...mine };
        for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = JSON.parse(JSON.stringify(patch[k])); }
        const o = mk(me, mine);
        peers.set(me, o);
        pend.updated.push(o);
        fire();
        announce();
        return Promise.resolve();
      },
      onPeers(h) { handlers.push(h); fire(); return () => { const i = handlers.indexOf(h); if (i >= 0) handlers.splice(i, 1); }; },
      peers: () => [...peers.values()],
      emit: () => Promise.resolve(),
      on: () => () => {},
      connected: () => client.connected,
      onConnection(h) { client.on('connect', () => h(true)); client.on('offline', () => h(false)); return () => {}; },
      leave() {
        left = true;
        removeEventListener('pagehide', bye);
        return new Promise((res) => client.publish(myTopic, '', { retain: true, qos: 1 }, () => { client.end(false, {}, res); }));
      },
    };
  }

  window.MG_BUILD = 'pages';
  window.MG_ROOM = () => (window.mqtt ? { join } : null);
})();
</script>

    if (g.step !== 'buy' || n !== this.cur() || g.offer == null) return;
    g.auc = { c: g.offer, bid: 0, by: null, dl: Date.now() + 15000 };
    g.offer = null;
    this.log(`«${CELLS[g.auc.c].n}» уходит на аукцион`);
    this.armAuction();
    this.proceed();
  }
  armAuction() {
    clearTimeout(this.timer);
    const left = Math.max(0, this.g.auc.dl - Date.now());

  }
  bid(n, amt) {
    const a = this.g.auc, p = this.pl[n];
    amt = Math.floor(Number(amt));
    if (!a || !p || p.out || !this.g.order.includes(n) || !(amt > a.bid) || amt > p.money) return;
    a.bid = amt; a.by = n;
    a.dl = Math.max(a.dl, Date.now() + 8000);
    this.armAuction();
    this.changed();
  }
  endAuction() {
    const g = this.g, a = g.auc;
    if (!a) return;
    if (a.by && this.pl[a.by].money >= a.bid) {
      this.pl[a.by].money -= a.bid;
      g.own[a.c] = { o: a.by, h: 0, m: 0 };
      this.log(`${a.by} выигрывает аукцион: «${CELLS[a.c].n}» за ${this.fmt(a.bid)}`);
    } else this.log(`На «${CELLS[a.c].n}» никто не поставил, улица осталась у банка`);
    g.auc = null;
    this.proceed();
  }

  // --- дома, залог ---
  build(n, c) {
    if (R.canBuild(this.state(), n, c) || this.g.ph !== 'play') return;
    const o = this.g.own[c];
    this.pl[n].money -= GROUPS[CELLS[c].g].house;
    if (o.h === 4) { this.g.hotels--; this.g.houses += 4; } else this.g.houses--;
    o.h++;

    this.changed();
  }
  sell(n, c) {
    if (R.canSell(this.state(), n, c) || this.g.ph !== 'play') return;
    const o = this.g.own[c];
    if (o.h === 5) { this.g.hotels++; this.g.houses -= 4; } else this.g.houses++;
    o.h--;
    const back = GROUPS[CELLS[c].g].house / 2;
    this.pl[n].money += back;
    this.log(`${n} продаёт ${o.h === 4 ? 'отель' : 'дом'} на «${CELLS[c].n}»: +${this.fmt(back)}`);
    this.changed();
  }
  mortgage(n, c) {
    if (R.canMortgage(this.state(), n, c) || this.g.ph !== 'play') return;
    this.g.own[c].m = 1;
    this.pl[n].money += mortgageValue(c);
    this.log(`${n} закладывает «${CELLS[c].n}»: +${this.fmt(mortgageValue(c))}`);
    this.changed();
  }
  unmortgage(n, c) {
    if (R.canUnmortgage(this.state(), n, c) || this.g.ph !== 'play') return;
    this.g.own[c].m = 0;
    this.pl[n].money -= unmortgageCost(c);
    this.log(`${n} выкупает «${CELLS[c].n}» из залога: −${this.fmt(unmortgageCost(c))}`);
    this.changed();
  }

  // --- долги и банкротство ---
  payDebt(n) {
    const g = this.g, d = g.debts[0];
    if (!d || d.who !== n || this.pl[n].money < d.amt) return;
    this.pl[n].money -= d.amt;
    if (d.to) this.pl[d.to].money += d.amt;
    this.log(`${n} гасит долг ${this.fmt(d.amt)}`);
    g.debts.shift();
    this.proceed();
  }
  bankrupt(n) {
    const g = this.g, d = g.debts[0];
    if (!d || d.who !== n) return;
    const p = this.pl[n], to = d.to;
    // Дома продаются банку за полцены
    for (const c in g.own) {
      const o = g.own[c];
      if (o.o !== n || !o.h) continue;
      p.money += (o.h * GROUPS[CELLS[c].g].house) / 2;
      if (o.h === 5) { g.hotels++; } else g.houses += o.h;
      o.h = 0;
    }
    if (to) {
      this.pl[to].money += p.money;
      this.pl[to].jc += p.jc;
      for (const c in g.own) if (g.own[c].o === n) g.own[c].o = to;
      this.log(`${n} банкрот! Всё имущество переходит к ${to}`);
    } else {
      for (const c in g.own) if (g.own[c].o === n) delete g.own[c];
      this.log(`${n} банкрот! Улицы возвращаются банку`);
    }
    p.money = 0; p.jc = 0; p.out = true;
    g.debts = g.debts.filter((x) => x.who !== n).map((x) => (x.to === n ? { ...x, to: null } : x));
    if (g.trade && (g.trade.from === n || g.trade.to === n)) g.trade = null;
    if (this.alive().length <= 1) return this.finish();
    if (this.cur() === n) {

    }
    this.proceed();
  }

  // --- сделки ---
  tradeOk(t) {

    if (!(t.gm >= 0 && t.rm >= 0 && t.gm <= A.money && t.rm <= B.money)) return false;
    if (!(t.gj >= 0 && t.rj >= 0 && t.gj <= A.jc && t.rj <= B.jc)) return false;
    if (!t.gc.every((c) => R.tradable(s, t.from, c)) || !t.rc.every((c) => R.tradable(s, t.to, c))) return false;
    return t.gm + t.rm + t.gj + t.rj + t.gc.length + t.rc.length > 0;

  propose(n, d) {
    const g = this.g;
    if (g.ph !== 'play' || g.trade || this.pl[n]?.out) return;
    const num = (v) => Math.max(0, Math.floor(Number(v) || 0));
    const cells = (a) => [...new Set((Array.isArray(a) ? a : []).map(Number).filter((c) => c >= 0 && c < 40))];
    const t = { id: ++g.tradeId, from: n, to: String(d.to), gm: num(d.gm), rm: num(d.rm), gj: num(d.gj), rj: num(d.rj), gc: cells(d.gc), rc: cells(d.rc) };
    if (!this.tradeOk(t)) return;
    g.trade = t;
    this.log(`${n} предлагает сделку игроку ${t.to}`);
    this.changed();
  }
  tradeAnswer(n, yes) {
    const g = this.g, t = g.trade;
    if (!t || n !== t.to) return;
    g.trade = null;
    if (!yes) { this.log(`${n} отклоняет сделку`); return this.changed(); }
    if (!this.tradeOk(t)) { this.log('Сделка сорвалась: условия изменились'); return this.changed(); }
    const A = this.pl[t.from], B = this.pl[t.to];

    A.jc += t.rj - t.gj; B.jc += t.gj - t.rj;
    for (const c of t.gc) g.own[c].o = t.to;
    for (const c of t.rc) g.own[c].o = t.from;
    this.log(`Сделка между ${t.from} и ${t.to} состоялась`);
    this.changed();
  }
  tradeCancel(n) {
    if (this.g.trade && this.g.trade.from === n) { this.g.trade = null; this.changed(); }
  }

  // --- конец игры ---
  finish() {
    clearTimeout(this.timer);

    g.ph = 'over';
    g.auc = null; g.trade = null; g.debts = [];

    this.changed();
  }

  // --- снимок и публичное состояние ---
  snapshot() { return { pl: this.pl, g: this.g, decks: this.decks, ok: this.ok }; }

  }
  pub() {

// ================= Действия =================
function act(k, d) {
  if (app.mode === 'client') {
    app.seq += 1;
    app.gameRoom?.presence({ a: { n: app.seq, k, d: d ?? null } }).catch(() => toast('Нет связи'));
  } else if (app.game) hostAct(app.myPeer || 'host', k, d, true);
}
function hostAct(peer, k, d, self) {
  const G = app.game;
  if (!G) return;
  if (k === 'approve' || k === 'deny') { if (self) G.approve(d, k === 'approve'); return; }
  if (k === 'join') { const e = G.join(String(d), peer, self); if (e && self) toast(e); return; }
  if (self && k === 'hostEnd') { if (G.g.ph === 'play') G.finish(); return; }
  if (self && k === 'skip') { G.endTurn(null, true); return; }
  if (self && k === 'newGame') { G.reset(); G.g.ph = 'lobby'; G.changed(); return; }
  const n = PLAYERS.find((x) => G.pl[x].peer === peer && G.pl[x].on);
  if (!n) return;
  const c = Number(d?.c);
  switch (k) {
    case 'start': G.start(); break;
    case 'roll': G.roll(n); break;
    case 'payJail': G.payJail(n); break;
    case 'jailCard': G.useJailCard(n); break;
    case 'buy': G.buy(n); break;
    case 'decline': G.decline(n); break;
    case 'bid': G.bid(n, d?.v); break;
    case 'end': G.endTurn(n); break;
    case 'build': G.build(n, c); break;
    case 'sell': G.sell(n, c); break;
    case 'mortgage': G.mortgage(n, c); break;

    case 'bankrupt': G.bankrupt(n); break;
    case 'propose': G.propose(n, d || {}); break;

}

async function initRoom() {

async function joinGameRoom(code) {
  const r = await app.room.join('ib-' + code);
  app.gameRoom = r; app.code = code;
  r.onPeers((ch) => {
    const mine = ch.peers.find((p) => p.sameTab);
    if (mine) app.myPeer = mine.peer;
    if (app.mode === 'host') {
      if (app.myPeer) for (const n of PLAYERS) if (app.game.pl[n].peer === 'host') app.game.pl[n].peer = app.myPeer;
      for (const p of [...ch.joined, ...ch.updated]) {
        if (p.sameTab) continue;
        const a = p.presence?.a;
        if (a && typeof a.n === 'number' && a.n > (app.lastSeq[p.peer] || 0)) { app.lastSeq[p.peer] = a.n; hostAct(p.peer, String(a.k), a.d, false); }
      }
      for (const p of ch.left) app.game.dropPeer(p.peer);
      for (const p of ch.joined) app.game.markPeer(p.peer);
    } else {
      const host = ch.peers.find((p) => p.presence?.host && p.presence?.s);
      if (host) {
        app.hostSeen = true;
        if (host.presence.s !== app.lastS) {
          app.lastS = host.presence.s; app.P = host.presence.s; app.offset = app.P.now - Date.now();
          if (app.me && app.myPeer && app.P.pl[app.me]?.[8] !== app.myPeer && !app.joinTried) { app.joinTried = true; act('join', app.me); }
          stateArrived();
        }
      } else if (app.hostSeen) { app.hostSeen = false; app.P = null; render(true); }
    }

}

      ctx.fillText(cell.s.toUpperCase(), 0, 80);

}

const tokOffset = (n) => { const i = PLAYERS.indexOf(n); return { x: (i % 2 ? 0.17 : -0.17), z: (i < 2 ? -0.17 : 0.17) }; };
function tokenSpot(n, i) { const c = cellCenter(i), o = tokOffset(n); return new THREE.Vector3(c.x + o.x * 1.1, 0, c.z + o.z * 1.1); }
function topCam() {
  const cam = T3.camera, fov = cam.fov * Math.PI / 180, need = B3 * 0.56;

  const d = fit / Math.tan(fov / 2);

async function playMove(mv) {
  const tok = T3.tokens[mv.who];
  if (!tok) return;
  T3.busy = true; renderPanel(true);
  setHint(`${mv.who} ходит…`);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (mv.kind === 'jump' || reduce || document.visibilityState !== 'visible') {
    const a = tokenSpot(mv.who, mv.from), b = tokenSpot(mv.who, mv.to);
    await tween(reduce ? 1 : 700, (k) => { tok.position.lerpVectors(a, b, k); tok.position.y = Math.sin(k * Math.PI) * 1.2; });
  } else {
    const dir = mv.kind === 'back' ? -1 : 1, n = Math.abs(mv.steps);
    let cur = mv.from;
    const curF = fwd(cur, dir);
    tok.rotation.y = Math.atan2(curF.x, curF.z);
    await animCam(behindCam(tokenSpot(mv.who, cur), curF), 850);
    for (let s = 0; s < n; s++) {
      const nxt = ((cur + dir) % 40 + 40) % 40;
      const a = tokenSpot(mv.who, cur), b = tokenSpot(mv.who, nxt);
      const f = fwd(nxt, dir);
      const camFrom = { ...camState }, camTo = behindCam(b, f);
      const r0 = tok.rotation.y; let r1 = Math.atan2(f.x, f.z);
      while (r1 - r0 > Math.PI) r1 -= 2 * Math.PI; while (r0 - r1 > Math.PI) r1 += 2 * Math.PI;
      await tween(330, (k) => {
        tok.position.lerpVectors(a, b, k);

        tok.rotation.y = r0 + (r1 - r0) * k;
        const e = ease(k);
        setCam({ pos: camFrom.pos.clone().lerp(camTo.pos, e), look: camFrom.look.clone().lerp(camTo.look, e) });
      });
      cur = nxt;
    }
    setHint(`${mv.who}: ${CELLS[mv.to].n}`);

    parts.push(`<div class="logo">ИТОГИ</div><div class="stack">${V.rank.map(([n, w, out], i) => `<div class="panel" style="grid-template-columns:auto 1fr auto;align-items:center"><span>${i === 0 ? '🏆' : i + 1 + '.'}</span><b>${esc(n)}</b><span class="money">${out ? 'банкрот' : 'состояние ' + eur(w)}</span></div>`).join('')}</div>
      ${app.mode === 'host' ? '<button class="btn" data-a="newGame">Новая игра</button>' : ''}`);
    return parts.join('');
  }
  if (T3.busy) parts.push(`<div class="panel"><p class="status">🎲 ${esc(V.cur)} ходит…</p></div>`);
  else {
    // входящая сделка
    if (V.trade && V.trade.to === me) parts.push(tradeOfferHtml(V, true));
    else if (V.trade && V.trade.from === me) parts.push(`<div class="panel"><p class="status">Ждём ответа на сделку от ${esc(V.trade.to)}…</p><button class="btn sec" data-a="tradeCancel">Отменить сделку</button></div>`);
    if (V.card) parts.push(cardBox(V.card));
    if (V.step === 'debt') {
      const d = V.debts[0], p = V.pl[d.who];
      if (d.who === me) parts.push(`<div class="panel"><p class="status">Нужно заплатить ${eur(d.amt)} ${d.to ? 'игроку ' + esc(d.to) : 'банку'}</p>
        <p class="note">У тебя ${eur(p.money)}. Продай дома или заложи улицы во вкладке «Мои улицы», либо предложи сделку.</p>
        <button class="btn good" data-a="payDebt" ${p.money >= d.amt ? '' : 'disabled'}>Оплатить ${eur(d.amt)}</button>
        <button class="btn bad" data-a="bankrupt" id="bkBtn">Объявить банкротство</button></div>`);
      else parts.push(`<div class="panel"><p class="status">${esc(d.who)} ищет ${eur(d.amt)}, чтобы заплатить ${d.to ? esc(d.to) : 'банку'}…</p></div>`);
    } else if (V.step === 'auction' && V.auc) {
      const a = V.auc, myMoney = me ? V.pl[me].money : 0, canBid = me && V.order.includes(me) && !V.pl[me].out;
      parts.push(`<div class="panel"><p class="status">🔨 Аукцион: ${esc(CELLS[a.c].n)}</p>
        <div class="big">${a.by ? eur(a.bid) + ' · ' + esc(a.by) : 'ставок нет'}</div>
        <p class="note" style="text-align:center">Осталось <span data-secs>${secsLeft(a.dl)}</span> с · цена улицы ${eur(CELLS[a.c].p)}</p>
        ${canBid ? `<div class="bidrow">${[10, 50, 100].map((s) => `<button data-bid="${a.bid + s}" ${a.bid + s > myMoney || a.by === me ? 'disabled' : ''}>+${s}</button>`).join('')}</div>
        <div class="two" style="grid-template-columns:1fr auto"><input id="bidIn" type="number" inputmode="numeric" placeholder="Своя ставка"><button class="btn sec" style="width:auto;padding:0 16px" data-a="bid">Ставлю</button></div>
        <p class="note">У тебя ${eur(myMoney)}</p>` : ''}
        <button class="btn ghost" data-cell="${a.c}">Карточка улицы</button></div>`);
    } else if (V.step === 'buy' && V.offer != null) {
      const c = V.offer;
      parts.push(`<div class="panel">${propCardHtml(V, c, false)}
        ${isMe ? `<div class="two"><button class="btn good" data-a="buy" ${cp.money >= CELLS[c].p ? '' : 'disabled'}>Купить за ${eur(CELLS[c].p)}</button><button class="btn sec" data-a="decline">Аукцион</button></div>
          ${cp.money < CELLS[c].p ? '<p class="note">Не хватает денег — можно заложить улицу или отправить на аукцион.</p>' : ''}`
        : `<p class="status">${esc(V.cur)} решает, покупать ли…</p>`}</div>`);
    } else if (V.step === 'roll') {
      if (isMe) {
        if (cp.jail) parts.push(`<div class="panel"><p class="status">🚔 Ты в тюрьме (попытка ${cp.jt + 1} из 3)</p>
          <button class="btn" data-a="roll">Бросить на дубль</button>
          <div class="two"><button class="btn sec" data-a="payJail" ${cp.money >= 50 ? '' : 'disabled'}>Заплатить 50 €</button><button class="btn sec" data-a="jailCard" ${cp.jc ? '' : 'disabled'}>Карта выхода (${cp.jc})</button></div></div>`);
        else parts.push(`<div class="panel"><p class="status">${V.dbl ? 'Дубль! Бросай ещё раз' : 'Твой ход!'}</p><button class="btn" data-a="roll">🎲 Бросить кубики</button></div>`);
      } else parts.push(`<div class="panel"><p class="status">Ход: ${esc(V.cur)}${cp.jail ? ' (в тюрьме)' : ''}</p>${!cp.on && app.mode === 'host' ? '<button class="btn sec" data-a="skip">Пропустить ход (нет связи)</button>' : ''}</div>`);
    } else if (V.step === 'end') {
      if (isMe) parts.push(`<div class="panel"><p class="note" style="text-align:center">Можно построить дома, заложить улицы или предложить сделку.</p><button class="btn" data-a="end">Завершить ход</button></div>`);
      else parts.push(`<div class="panel"><p class="status">${esc(V.cur)} завершает ход…</p>${!cp.on && app.mode === 'host' ? '<button class="btn sec" data-a="skip">Пропустить ход (нет связи)</button>' : ''}</div>`);
    }
  }
  // вкладки
  parts.push(`<div class="tabs"><button class="${app.tab === 'cards' ? 'on' : ''}" data-tab="cards">Мои улицы</button><button class="${app.tab === 'trade' ? 'on' : ''}" data-tab="trade">Сделка</button><button class="${app.tab === 'log' ? 'on' : ''}" data-tab="log">Журнал</button></div>`);
  if (app.tab === 'cards') parts.push(propListHtml(V, me));
  if (app.tab === 'trade') parts.push(me && !V.pl[me].out ? `<div class="panel"><p class="note">Обменивайся улицами, деньгами и картами выхода из тюрьмы. Улицы с домами в группе обменивать нельзя.</p>
      <button class="btn" data-a="newTrade" ${V.trade ? 'disabled' : ''}>Предложить сделку</button></div>` : '<p class="sub">Сделки недоступны</p>');
  if (app.tab === 'log') parts.push(`<div class="panel log">${V.log.map((l) => `<div>${esc(l)}</div>`).join('')}</div>`);
  return parts.join('');
}
function secsLeft(dl) { return Math.max(0, Math.ceil((dl - (Date.now() + app.offset)) / 1000)); }
setInterval(() => { const V = view(); if (V?.auc) document.querySelectorAll('[data-secs]').forEach((e) => { e.textContent = secsLeft(V.auc.dl); }); }, 250);

function propListHtml(V, n) {
  if (!n) return '<p class="sub">Ты наблюдатель</p>';
  const mine = Object.keys(V.own).map(Number).filter((c) => V.own[c].o === n).sort((a, b) => a - b);
  const p = V.pl[n];
  return `<div class="plist">${mine.map((c) => {
    const o = V.own[c], cell = CELLS[c];
    const col = cell.t === 'prop' ? GROUPS[cell.g].c : '#94a3b8';
    const houses = o.h === 5 ? '🏨' : '🏠'.repeat(o.h);
    return `<button class="pitem" data-cell="${c}"><span class="bar" style="background:${col}"></span>
      <span><span class="nm">${cell.e} ${esc(cell.n)}</span>${o.m ? '<span class="tag">в залоге</span>' : ''}<br><span class="meta">${houses || 'без домов'} · аренда ${eur(R.rent(V.s, c, 7))}${cell.t === 'util' ? ' (при 7)' : ''}</span></span>
      <span>›</span></button>`;
  }).join('') || '<p class="sub">Пока нет улиц. Покупай клетки, на которые встаёшь!</p>'}
  ${p.jc ? `<p class="note">Карт «Выйти из тюрьмы»: ${p.jc}</p>` : ''}</div>`;
}

function propCardHtml(V, c, withActs) {
  const cell = CELLS[c], o = V.own[c], me = myName();
  const head = cell.t === 'prop' ? GROUPS[cell.g].c : cell.t === 'rail' ? '#37474f' : cell.t === 'util' ? '#5d4037' : '#455a64';
  let rows = '';
  if (cell.t === 'prop') {
    const t = rentTable(cell.p), h = o?.h ?? -1, full = o && R.ownsGroup(V.s, o.o, cell.g);
    rows = `<div class="dl">
      <span class="${h === 0 && !full ? 'hl' : ''}">Аренда</span><b>${eur(t[0])}</b>
      <span class="${h === 0 && full ? 'hl' : ''}">Вся группа без домов</span><b>${eur(t[0] * 2)}</b>
      ${[1, 2, 3, 4].map((k) => `<span class="${h === k ? 'hl' : ''}">${k} ${k === 1 ? 'дом' : 'дома'}</span><b>${eur(t[k])}</b>`).join('')}
      <span class="${h === 5 ? 'hl' : ''}">Отель</span><b>${eur(t[5])}</b>
      <span>Дом стоит</span><b>${eur(GROUPS[cell.g].house)}</b>
      <span>Залог / выкуп</span><b>${eur(mortgageValue(c))} / ${eur(unmortgageCost(c))}</b></div>`;
  } else if (cell.t === 'rail') {
    rows = `<div class="dl">${[1, 2, 3, 4].map((k) => `<span>${k} транспорт${k > 1 ? 'а' : ''} у владельца</span><b>${eur(RAIL_RENT[k])}</b>`).join('')}<span>Залог / выкуп</span><b>${eur(mortgageValue(c))} / ${eur(unmortgageCost(c))}</b></div>`;
  } else if (cell.t === 'util') {
    rows = `<div class="dl"><span>Одна служба у владельца</span><b>кубики × 4</b><span>Обе службы</span><b>кубики × 10</b><span>Залог / выкуп</span><b>${eur(mortgageValue(c))} / ${eur(unmortgageCost(c))}</b></div>`;
  } else if (cell.t === 'luck' || cell.t === 'bank') {
    rows = `<p class="desc">Встал сюда — тянешь карточку «${cell.t === 'luck' ? 'Удача' : 'Банк'}». Там шуточные истории про Марину, Сережу, Дашу и Андрея.</p>`;
  }
  let acts = '';
  if (withActs && o && o.o === me && V.ph === 'play') {
    const btn = (k, label, why, pri) => `<button class="${pri ? 'pri' : ''}" data-act="${k}" data-c="${c}" ${why ? 'disabled' : ''} title="${esc(why || '')}">${label}</button>`;
    const wb = R.canBuild(V.s, me, c), ws = R.canSell(V.s, me, c), wm = R.canMortgage(V.s, me, c), wu = R.canUnmortgage(V.s, me, c);
    const parts = [];
    if (cell.t === 'prop') parts.push(btn('build', `${o.h === 4 ? 'Отель' : 'Дом'} −${eur(GROUPS[cell.g].house)}`, wb, true), btn('sell', `Продать +${eur(GROUPS[cell.g].house / 2)}`, ws));
    parts.push(o.m ? btn('unmortgage', `Выкупить −${eur(unmortgageCost(c))}`, wu, true) : btn('mortgage', `Заложить +${eur(mortgageValue(c))}`, wm));
    const why = cell.t === 'prop' && wb && wb !== 'Нельзя' && o.h < 5 ? `<p class="why">${esc(wb)}</p>` : '';
    acts = `<div class="acts">${parts.join('')}</div>${why}`;
  }
  const price = cell.p ? ` · ${eur(cell.p)}` : cell.amt ? ` · ${eur(cell.amt)}` : '';
  return `<div class="propcard"><div class="head" style="background:${head}"><div class="g">${cell.t === 'prop' ? esc(GROUPS[cell.g].name) : cell.t === 'rail' ? 'Транспорт' : cell.t === 'util' ? 'Служба' : 'Клетка'}${price}</div><div class="t">${esc(cell.n)}</div></div>
    <div class="body"><div class="emo">${cell.e}</div>${cell.d ? `<p class="desc">${esc(cell.d)}</p>` : ''}${rows}
    ${OWNABLE(c) ? `<p class="owner">${o ? `Владелец: <span style="color:${PCOLORS[o.o]}">${esc(o.o)}</span>${o.m ? ' · в залоге' : ''}${o.h ? ' · ' + (o.h === 5 ? 'отель' : o.h + ' дом.') : ''}` : 'Свободна — продаётся'}</p>` : ''}
    ${acts}</div></div>`;
}

function tradeOfferHtml(V, incoming) {
  const t = V.trade;
  const list = (cells) => cells.map((c) => `${CELLS[c].e} ${esc(CELLS[c].n)}`).join(', ') || '—';
  return `<div class="panel req"><p class="status">🤝 ${esc(t.from)} предлагает сделку</p>
    <div class="dl"><span>Ты получаешь улицы</span><b>${list(t.gc)}</b><span>Ты получаешь деньги</span><b>${eur(t.gm)}</b>${t.gj ? `<span>Карты выхода</span><b>${t.gj}</b>` : ''}
    <span>Ты отдаёшь улицы</span><b>${list(t.rc)}</b><span>Ты отдаёшь деньги</span><b>${eur(t.rm)}</b>${t.rj ? `<span>Карты выхода</span><b>${t.rj}</b>` : ''}</div>
    ${incoming ? '<div class="two"><button class="btn good" data-a="tradeYes">Принять</button><button class="btn sec" data-a="tradeNo">Отклонить</button></div>' : ''}</div>`;
}

// ---------- Всплывающие окна ----------
function openCell(c) { openSheet({ k: 'cell', c }); }
function openSheet(s) { app.sheet = s; renderSheet(); }
function closeSheet() { app.sheet = null; $('#sheetWrap').hidden = true; }
function renderSheet() {
  const s = app.sheet, V = view(), box = $('#sheet');
  if (!s) return;
  const fid = document.activeElement?.id, fval = fid ? document.getElementById(fid)?.value : null;
  let html = '<button class="x" data-close="1">Закрыть ✕</button>';
  if (s.k === 'cell' && V) html += propCardHtml(V, s.c, true);
  else if (s.k === 'player' && V) {
    const n = s.n, p = V.pl[n];
    const cells = Object.keys(V.own).map(Number).filter((c) => V.own[c].o === n).sort((a, b) => a - b);
    html += `<h2 style="color:${PCOLORS[n]}">${esc(n)}</h2><p class="sub">${eur(p.money)} · состояние ${eur(R.worth(V.s, n))}${p.jail ? ' · в тюрьме' : ''}${p.jc ? ' · карт выхода: ' + p.jc : ''}</p>
      <div class="plist">${cells.map((c) => `<button class="pitem" data-cell="${c}"><span class="bar" style="background:${CELLS[c].t === 'prop' ? GROUPS[CELLS[c].g].c : '#94a3b8'}"></span><span class="nm">${CELLS[c].e} ${esc(CELLS[c].n)}${V.own[c].m ? '<span class="tag">в залоге</span>' : ''}</span><span>${V.own[c].h === 5 ? '🏨' : '🏠'.repeat(V.own[c].h)}</span></button>`).join('') || '<p class="sub">Улиц нет</p>'}</div>`;
  } else if (s.k === 'menu') {
    html += `<h2>Меню</h2>${app.code ? `<p class="sub">Игра ${esc(app.code)}${myName() ? ' · ты: ' + esc(myName()) : ''}</p>` : ''}
      ${app.mode === 'host' && V?.ph === 'play' ? '<button class="btn sec" data-a="hostEnd" id="hostEndBtn">Закончить игру и посчитать богатство</button>' : ''}
      ${app.mode === 'host' && V?.ph === 'play' ? `<div class="panel">${inviteHtml()}</div>` : ''}
      <button class="btn ghost" data-a="exit">Выйти в главное меню</button>`;
  } else if (s.k === 'trade' && V) {
    const me = myName(), others = V.order.filter((n) => n !== me && !V.pl[n].out);
    const to = s.to && others.includes(s.to) ? s.to : others[0];
    s.to = to;
    const mineC = Object.keys(V.own).map(Number).filter((c) => R.tradable(V.s, me, c));
    const theirC = to ? Object.keys(V.own).map(Number).filter((c) => R.tradable(V.s, to, c)) : [];
    const chk = (c, side) => `<label class="check"><input type="checkbox" data-tc="${side}" value="${c}" ${(s[side] || []).includes(c) ? 'checked' : ''}><span>${CELLS[c].e} ${esc(CELLS[c].s)}</span></label>`;
    html += `<h2>Сделка</h2>
      <div class="pnames">${others.map((n) => `<button data-tto="${esc(n)}" style="${n === to ? 'outline:3px solid var(--gold)' : ''}"><span class="dot" style="background:${PCOLORS[n]}"></span>${esc(n)}</button>`).join('')}</div>
      ${to ? `<div class="cols"><div><b>Ты отдаёшь</b>${mineC.map((c) => chk(c, 'gc')).join('') || '<span class="note">нет улиц</span>'}
          <input id="tgm" type="number" inputmode="numeric" min="0" placeholder="Деньги, €" value="${esc(s.gm ?? '')}">
          ${V.pl[me].jc ? `<input id="tgj" type="number" min="0" max="${V.pl[me].jc}" placeholder="Карты выхода" value="${esc(s.gj ?? '')}">` : ''}</div>
        <div><b>Получаешь (${esc(to)})</b>${theirC.map((c) => chk(c, 'rc')).join('') || '<span class="note">нет улиц</span>'}
          <input id="trm" type="number" inputmode="numeric" min="0" placeholder="Деньги, €" value="${esc(s.rm ?? '')}">
          ${V.pl[to].jc ? `<input id="trj" type="number" min="0" max="${V.pl[to].jc}" placeholder="Карты выхода" value="${esc(s.rj ?? '')}">` : ''}</div></div>
        <p class="note">У тебя ${eur(V.pl[me].money)}, у ${esc(to)} ${eur(V.pl[to].money)}</p>
        <button class="btn" data-a="sendTrade">Отправить предложение</button>` : '<p class="sub">Не с кем меняться</p>'}`;
  }
  box.innerHTML = html;
  $('#sheetWrap').hidden = false;
  const el = fid && document.getElementById(fid);
  if (el) { if (fval != null && 'value' in el) el.value = fval; el.focus(); }
  bindSheet();
}

// ---------- Обработчики ----------
const armed = {};
function confirmTwice(id, btn, label, fn) {
  if (armed[id]) { armed[id] = false; fn(); return; }
  armed[id] = true; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { armed[id] = false; if (btn.isConnected) btn.textContent = old; }, 3000);
}
const actions = {
  host: () => { store.del('host'); hostOnline(null); },
  resume: () => hostOnline(store.get('host')),
  join: () => joinOnline($('#code').value),
  exit: () => { closeSheet(); exitToMenu(); },
  copy: () => { const i = $('#invite'); navigator.clipboard?.writeText(i.value).then(() => toast('Ссылка скопирована'), () => { i.select(); toast('Выдели и скопируй ссылку'); }); },
  share: () => { if (navigator.share) navigator.share({ title: 'Иббенбюрен: наша команда', text: 'Заходи играть!', url: inviteUrl() }).catch(() => {}); else { $('#invite').select(); toast('Скопируй ссылку и отправь'); } },
  start: () => act('start'),
  roll: () => act('roll'),
  payJail: () => act('payJail'),
  jailCard: () => act('jailCard'),
  buy: () => act('buy'),
  decline: () => act('decline'),
  end: () => act('end'),
  skip: () => act('skip'),
  payDebt: () => act('payDebt'),
  bankrupt: (b) => confirmTwice('bk', b, 'Точно банкрот? Нажми ещё раз', () => act('bankrupt')),
  bid: () => { const v = Number($('#bidIn').value); if (!v) return toast('Впиши ставку'); act('bid', { v }); $('#bidIn').value = ''; },
  tradeYes: () => act('tradeYes'),
  tradeNo: () => act('tradeNo'),
  tradeCancel: () => act('tradeCancel'),
  newTrade: () => openSheet({ k: 'trade', gc: [], rc: [] }),
  hostEnd: (b) => confirmTwice('he', b, 'Точно закончить? Нажми ещё раз', () => { act('hostEnd'); closeSheet(); }),
  newGame: () => act('newGame'),
  sendTrade: () => {
    const s = app.sheet;
    const num = (id) => Number($('#' + id)?.value || 0);
    act('propose', { to: s.to, gc: s.gc || [], rc: s.rc || [], gm: num('tgm'), rm: num('trm'), gj: num('tgj'), rj: num('trj') });
    closeSheet(); app.tab = 'cards'; toast('Предложение отправлено');
  },
};
function bindCommon(root) {
  root.querySelectorAll('[data-a]').forEach((b) => { const h = actions[b.dataset.a]; if (h) b.onclick = () => h(b); });
  root.querySelectorAll('[data-cell]').forEach((b) => b.onclick = () => openCell(Number(b.dataset.cell)));
}
function bindMain() {
  const m = $('#main');
  bindCommon(m);
  m.querySelectorAll('[data-join]').forEach((b) => b.onclick = () => { app.me = b.dataset.join; if (app.mode === 'client') { store.set('client', { code: app.code, me: app.me, at: Date.now() }); app.joinTried = true; } act('join', app.me); });
  m.querySelectorAll('[data-appr]').forEach((b) => b.onclick = () => act('approve', b.dataset.appr));
  m.querySelectorAll('[data-deny]').forEach((b) => b.onclick = () => act('deny', b.dataset.deny));
  m.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { app.tab = b.dataset.tab; renderPanel(true); });
  m.querySelectorAll('[data-bid]').forEach((b) => b.onclick = () => act('bid', { v: Number(b.dataset.bid) }));
  const code = $('#code'); if (code) code.onkeydown = (e) => { if (e.key === 'Enter') joinOnline(code.value); };
}
function bindSheet() {
  const sh = $('#sheet');
  bindCommon(sh);
  sh.querySelectorAll('[data-close]').forEach((b) => b.onclick = closeSheet);
  sh.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(b.dataset.act, { c: Number(b.dataset.c) }));
  sh.querySelectorAll('[data-tto]').forEach((b) => b.onclick = () => { Object.assign(app.sheet, { to: b.dataset.tto, rc: [] }); renderSheet(); });
  sh.querySelectorAll('[data-tc]').forEach((b) => b.onchange = () => {
    const side = b.dataset.tc, c = Number(b.value), arr = app.sheet[side] || [];
    app.sheet[side] = b.checked ? [...new Set([...arr, c])] : arr.filter((x) => x !== c);
  });
  ['tgm', 'trm', 'tgj', 'trj'].forEach((id) => { const el = $('#' + id); if (el) el.oninput = () => { app.sheet[id.slice(1)] = el.value; }; });
}
$('#sheetWrap').addEventListener('click', (e) => { if (e.target.id === 'sheetWrap') closeSheet(); });

// ---------- Запуск ----------
(function boot() {
  const m = /^#g(\d{4,6})$/.exec(location.hash);
  if (m) app.hashCode = m[1];
  renderPanel(true);
  initRoom().then(() => {
    const cs = store.get('client');
    if (cs && cs.me && (!app.hashCode || cs.code === app.hashCode) && Date.now() - cs.at < 24 * 3600e3) app.me = cs.me;
    if (!app.mode && app.room && app.hashCode) {
      const hs = store.get('host');
      if (hs && hs.code === app.hashCode) hostOnline(hs); else joinOnline(app.hashCode);
    }
  });
})();
</script>

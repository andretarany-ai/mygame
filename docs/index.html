<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>// Связь между телефонами для версии на GitHub Pages: тот же интерфейс, что у «комнат» claude.ai
// (join → presence / onPeers / leave), но через публичный MQTT-брокер. Регистрация не нужна.
(function () {
  // Первый — на обычном порту 443 (проходит через большинство сетей), остальные — запасные
  const BROKERS = window.MG_BROKERS || [
    { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' },
    { url: 'wss://broker.emqx.io:8084/mqtt' },
    { url: 'wss://broker.hivemq.com:8884/mqtt' },
  ];
  const PREFIX = 'moyaigra-v1-k7q2/';
  const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  const me = rid();

  function connect(list, opts) {
    return new Promise((resolve, reject) => {
      let i = 0;
      const tryNext = () => {
        if (i >= list.length) return reject(new Error('no broker'));
        const b = typeof list[i] === 'string' ? { url: list[i] } : list[i];
        i += 1;
        const o = { ...opts };
        if (b.username) { o.username = b.username; o.password = b.password; }
        const c = window.mqtt.connect(b.url, o);
        const t = setTimeout(() => { c.end(true); tryNext(); }, 7000);
        c.once('connect', () => { clearTimeout(t); resolve(c); });
      };
      tryNext();
    });
  }

  async function join(name) {
    const base = PREFIX + name + '/p/';
    const myTopic = base + me;
    let mine = {};
    const peers = new Map();
    const handlers = [];
    let first = true, sched = false, left = false;
    let pend = { joined: [], left: [], updated: [] };
    const mk = (peer, presence) => Object.freeze({ peer, presence: Object.freeze(presence), sameTab: peer === me, isMe: peer === me, by: null, kind: 'viewer', guest: false, updatedAt: Date.now() });
    peers.set(me, mk(me, {}));

    function fire() {
      if (sched) return;
      sched = true;
      setTimeout(() => {
        sched = false;
        const all = [...peers.values()];
        const ch = first ? { peers: all, joined: all, left: [], updated: [] } : { peers: all, ...pend };
        first = false;
        pend = { joined: [], left: [], updated: [] };
        handlers.forEach((h) => { try { h(ch); } catch (e) { console.error(e); } });
      }, 10);
    }

    const client = await connect(BROKERS, {
      clientId: 'mg_' + me + '_' + rid().slice(0, 4),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 7000,
      will: { topic: myTopic, payload: '', retain: true, qos: 1 },
    });

    const announce = () => client.publish(myTopic, JSON.stringify(mine), { retain: true, qos: 1 });
    client.on('connect', () => { client.subscribe(base + '+', { qos: 1 }); announce(); });
    client.subscribe(base + '+', { qos: 1 });
    announce();

    client.on('message', (topic, buf) => {
      if (!topic.startsWith(base)) return;
      const peer = topic.slice(base.length);
      if (peer === me) return;
      const txt = buf.toString();
      if (!txt) {
        const o = peers.get(peer);
        if (o) { peers.delete(peer); pend.left.push(o); fire(); }
        return;
      }
      let pr;
      try { pr = JSON.parse(txt); } catch (e) { return; }
      if (!pr || typeof pr !== 'object') return;
      const had = peers.has(peer);
      const o = mk(peer, pr);
      peers.set(peer, o);
      (had ? pend.updated : pend.joined).push(o);
      fire();
    });

    const bye = () => { try { client.publish(myTopic, '', { retain: true, qos: 0 }); } catch (e) { /* закрываемся */ } };
    addEventListener('pagehide', bye);

    return {
      name,
      presence(patch) {
        if (left) return Promise.reject({ code: 'invalid_argument', message: 'left' });
        mine = { ...mine };
        for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = JSON.parse(JSON.stringify(patch[k])); }
        const o = mk(me, mine);
        peers.set(me, o);
        pend.updated.push(o);
        fire();
        announce();
        return Promise.resolve();
      },
      onPeers(h) { handlers.push(h); fire(); return () => { const i = handlers.indexOf(h); if (i >= 0) handlers.splice(i, 1); }; },
      peers: () => [...peers.values()],
      emit: () => Promise.resolve(),
      on: () => () => {},
      connected: () => client.connected,
      onConnection(h) { client.on('connect', () => h(true)); client.on('offline', () => h(false)); return () => {}; },
      leave() {
        left = true;
        removeEventListener('pagehide', bye);
        return new Promise((res) => client.publish(myTopic, '', { retain: true, qos: 1 }, () => { client.end(false, {}, res); }));
      },
    };
  }

  window.MG_BUILD = 'pages';
  window.MG_ROOM = () => (window.mqtt ? { join } : null);
})();
</script>

<style>
/* Студия телевикторины: тёмно-синее табло, золотые номиналы, красная кнопка. Один тёмный мир для обеих тем. */

  --p1: #e2232c; --p2: #f08a1c; --p3: #1fa463; --p4: #8a4dff;
  --display: "Russo One", "Arial Black", Impact, sans-serif;

}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #1a3088 0%, var(--bg) 70%) var(--bg);
  color: var(--fg); font-family: var(--body); font-size: 16px;
  display: flex; flex-direction: column; min-height: 100%;
}
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; color: inherit; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input {
  font: inherit; font-size: 20px; padding: 14px; border-radius: 12px; width: 100%;
  border: 2px solid var(--cell-hi); background: var(--field); color: var(--ink); color-scheme: light;
}
.wrap { width: 100%; max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: rgba(0,0,0,.28); padding-block: 8px; }
header .wrap { display: flex; gap: 6px; align-items: stretch; }
#scores { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.score { background: var(--bg2); border-radius: 10px; padding: 5px 4px; text-align: center; border: 2px solid transparent; min-width: 0; }

.logo { font-family: var(--display); font-size: 44px; text-align: center; color: var(--gold); letter-spacing: 2px; line-height: 1; margin-top: 12px; text-shadow: 0 4px 0 #0009; text-wrap: balance; }

.board.mine .cellb:not(.used):active { background: var(--cell-hi); }

.edit-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#scoreEdit .edit-btns button { padding: 10px 0; background: var(--cell); font-weight: 800; }

.edit-set { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.edit-set input { font-size: 17px; padding: 10px; }
#scoreEdit .edit-set button { padding: 0 14px; background: var(--gold); color: var(--ink); font-weight: 800; }
#scoreEdit { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 11; padding: 16px; overflow-y: auto; }
#scoreEdit .menu-box { max-height: 100%; overflow-y: auto; }
.cat { font-size: 64px; text-align: center; line-height: 1; }
.res { background: var(--bg2); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
.res b { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.res.win { outline: 2px solid var(--gold); }
.delta.p { color: var(--good); font-weight: 800; }
.delta.m { color: var(--bad); font-weight: 800; }
details { color: var(--muted); }
details p { color: var(--fg); line-height: 1.5; font-size: 15px; }
summary { cursor: pointer; text-align: center; }

#menu { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.menu-box { background: var(--bg2); padding: 16px; border-radius: 16px; display: grid; gap: 10px; width: min(100%, 340px); }
.menu-box button { padding: 14px; background: var(--cell); }
.menu-box button.danger { background: #7a1d24; }
.menu-box button.ghost { background: transparent; border: 1px solid #ffffff33; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000d; padding: 12px 18px; border-radius: 12px; z-index: 20; max-width: 90vw; text-align: center; }

@media (min-width: 700px) {
  .cellb { font-size: 22px; padding: 18px 0; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

// ================= Проверка ответа =================
// Мягкая проверка ответа (общая для сервера и одностраничной версии).
//  - большие и маленькие буквы не важны, «ё/е», украинские «і/ї/є/ґ» = «и/и/е/г»;
//  - прощаются мелкие опечатки (1 буква в словах от 4 букв, 2 — от 9);
//  - засчитывается часть ответа: «Кит» = «Синий кит», «Сечь» = «Запорожская Сечь»;
//  - лишние слова тоже не мешают: «озеро Байкал» = «Байкал»;
//  - числа должны совпадать точно.
function normalizeAnswer(s) {
  return String(s)
    .toLowerCase()
    .replace(/ё/g, 'е').replace(/[ії]/g, 'и').replace(/є/g, 'е').replace(/ґ/g, 'г')
    .replace(/[«»"'`’ʼ.,!?;:()_]/g, ' ')
    .replace(/[-–—]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

const tol = (w) => (w.length >= 9 ? 2 : w.length >= 4 ? 1 : 0);
const isNum = (w) => /^\d+$/.test(w);
const close = (a, b) => (isNum(a) || isNum(b) ? a === b : lev(a, b) <= tol(b));
// Слова короче 3 букв («да», «по», «с») сами по себе ответом не считаются
const words = (s) => s.split(' ').filter((w) => w.length >= 3 || isNum(w) || /^[ivx]+$/.test(w));

function matchOne(input, variant) {
  const a = normalizeAnswer(input), v = normalizeAnswer(variant);
  if (!a || !v) return false;
  if (a === v) return true;
  if (isNum(v.replace(/ /g, ''))) return a.replace(/\D/g, '') === v.replace(/ /g, '');
  if (lev(a.replace(/ /g, ''), v.replace(/ /g, '')) <= tol(v.replace(/ /g, ''))) return true;
  const aw = words(a), vw = words(v);
  if (!aw.length || !vw.length) return false;
  // часть ответа: все слова игрока есть в правильном ответе
  if (aw.every((w) => vw.some((x) => close(w, x)))) return true;
  // правильный ответ целиком есть в ответе игрока
  if (vw.every((x) => aw.some((w) => close(w, x)))) return true;
  return false;
}

function checkAnswer(raw, q) {
  const text = String(raw || '').trim();
  if (!text) return { ok: false, reason: 'Нет ответа' };
  const ok = [q.a, ...(q.alt || [])].some((v) => matchOne(text, v));
  return ok ? { ok: true } : { ok: false, reason: 'Неверно' };
}

if (typeof module !== 'undefined') module.exports = { checkAnswer, normalizeAnswer, matchOne };

class Game {
  constructor(onChange, saved) {
    this.onChange = onChange;
    this.timer = null;
    this.buzzWin = null;
    if (saved) this.restore(saved); else this.reset(true);
  }
  reset(full) {
    this.clear();
    const old = this.pl;
    this.pl = {};
    for (const n of NAMES) this.pl[n] = { score: 0, joined: full ? false : !!old?.[n]?.joined, on: full ? false : !!old?.[n]?.on, peer: full ? null : old?.[n]?.peer ?? null };
    this.g = { ph: 'lobby', ri: -1, used: null, cat: null, ch: null, dl: null, cur: null, fin: null, msg: '' };
    this.rq = this.rq || [];
    this.ok = this.ok || {};
  }
  clear() { clearTimeout(this.timer); this.timer = null; clearTimeout(this.buzzWin?.t); this.buzzWin = null; }
  phase(ph, ms, next) {
    this.clear();
    this.g.ph = ph;
    this.g.dl = ms ? Date.now() + ms : null;
    if (ms && next) this.timer = setTimeout(next, ms);
    this.changed();
  }
  changed() { this.onChange(); }
  joined() { return NAMES.filter((n) => this.pl[n].joined); }
  online() { return NAMES.filter((n) => this.pl[n].joined && this.pl[n].on); }

  // --- игроки ---
  // Вход по ссылке: новый телефон попадает в список заявок, хост разрешает или отклоняет
  join(name, peer, trusted) {
    const p = this.pl[name];
    if (!p) return 'Нет такого игрока';
    if (p.on && p.peer && p.peer !== peer) return name + ' уже играет на другом телефоне';
    if (!trusted && !this.ok[peer]) {
      this.rq = this.rq.filter((r) => r[1] !== peer).concat([[name, peer]]).slice(-8);
      this.changed();
      return null;
    }
    for (const n of NAMES) if (n !== name && this.pl[n].peer === peer) { this.pl[n].on = false; this.pl[n].peer = null; }
    Object.assign(p, { joined: true, on: true, peer });
    this.changed();
    return null;
  }
  adjust(name, delta) {
    if (!this.pl[name] || !Number.isFinite(delta)) return;
    this.pl[name].score = Math.max(-999999, Math.min(999999, this.pl[name].score + Math.round(delta)));
    this.changed();
  }
  setScore(name, value) {
    if (!this.pl[name] || !Number.isFinite(value)) return;
    this.pl[name].score = Math.max(-999999, Math.min(999999, Math.round(value)));
    this.changed();
  }
  approve(peer, yes) {
    const r = this.rq.find((x) => x[1] === peer);
    this.rq = this.rq.filter((x) => x[1] !== peer);
    if (r && yes) { this.ok[peer] = 1; if (this.join(r[0], peer, true)) this.changed(); } else this.changed();
  }
  markPeer(peer) {
    let ch = false;
    for (const n of NAMES) if (this.pl[n].peer === peer && this.pl[n].joined && !this.pl[n].on) { this.pl[n].on = true; ch = true; }
    if (ch) this.changed();
  }
  setLocalPlayers(names) { for (const n of NAMES) Object.assign(this.pl[n], { joined: names.includes(n), on: names.includes(n), peer: 'local' }); }
  dropPeer(peer) {
    let ch = false;
    for (const n of NAMES) if (this.pl[n].peer === peer && this.pl[n].on) { this.pl[n].on = false; ch = true; }
    if (this.rq.some((r) => r[1] === peer)) { this.rq = this.rq.filter((r) => r[1] !== peer); ch = true; }
    if (ch) this.changed();
  }

  // --- раунды ---
  start() {
    if (this.g.ph !== 'lobby' || !this.joined().length) return;
    for (const n of NAMES) this.pl[n].score = 0;
    this.round(0);
  }
  round(ri) {
    const r = DATA.rounds[ri];
    const js = this.joined();
    this.g.ri = ri;
    this.g.used = Array(r.themes.length * r.values.length).fill(0);
    this.g.cat = Math.floor(Math.random() * r.themes.length) * r.values.length + 1 + Math.floor(Math.random() * (r.values.length - 1));
    this.g.cur = null;
    if (ri === 0 || !this.g.ch) this.g.ch = js[Math.floor(Math.random() * js.length)];
    else {
      const min = Math.min(...js.map((n) => this.pl[n].score));
      const lows = js.filter((n) => this.pl[n].score === min);
      this.g.ch = lows[Math.floor(Math.random() * lows.length)];
    }
    this.phase('roundIntro', T.roundIntro, () => this.phase('board'));
  }
  pick(name, ti, qi) {
    const g = this.g;
    if (g.ph !== 'board') return;
    const chOn = g.ch && this.pl[g.ch].on;
    if (chOn && name !== g.ch) return;
    const nv = DATA.rounds[g.ri].values.length;
    const idx = ti * nv + qi;
    if (g.used[idx] == null || g.used[idx]) return;
    g.used[idx] = 1;
    if (!chOn) g.ch = name;
    const q = qOf(g.ri, ti, qi);
    g.cur = { ti, qi, v: DATA.rounds[g.ri].values[qi], cat: idx === g.cat, ct: null, an: null, tr: [], at: [], res: null };
    if (g.cur.cat) {
      this.phase('cat', T.cat, () => {
        const others = this.online().filter((n) => n !== g.ch);
        this.catGive(g.ch, others[Math.floor(Math.random() * others.length)] || g.ch);
      });
    } else this.phase('reading', readTime(q.q), () => this.openBuzz());
  }
  catGive(from, to) {
    const g = this.g;
    if (g.ph !== 'cat' || from !== g.ch || !this.pl[to]?.joined) return;
    if (to === g.ch && this.online().some((n) => n !== g.ch)) return;
    g.cur.ct = to; g.cur.an = to;
    this.phase('reading', readTime(qOf(g.ri, g.cur.ti, g.cur.qi).q), () => this.phase('answering', T.answer, () => this.answer(to, '', true)));
  }
  openBuzz() { this.phase('buzzing', T.buzz, () => { this.g.cur.res = 'none'; this.reveal(); }); }
  buzz(name, rt) {
    const g = this.g;
    if (g.ph !== 'buzzing' || !this.pl[name]?.joined || g.cur.tr.includes(name)) return;
    rt = Number.isFinite(rt) ? Math.max(0, rt) : 99999;
    if (!this.buzzWin) {
      // Короткое окно: из нажатий, пришедших почти одновременно, побеждает самое быстрое
      this.buzzWin = { list: [], t: setTimeout(() => {
        const w = this.buzzWin.list.sort((a, b) => a.rt - b.rt)[0];
        this.buzzWin = null;
        if (g.ph !== 'buzzing') return;
        g.cur.an = w.name;
        this.phase('answering', T.answer, () => this.answer(w.name, '', true));
      }, T.buzzWindow) };
    }
    if (!this.buzzWin.list.some((b) => b.name === name)) this.buzzWin.list.push({ name, rt });
  }
  answer(name, text, timeout) {
    const g = this.g, c = g.cur;
    if (g.ph !== 'answering' || c.an !== name) return;
    text = String(text || '').trim().slice(0, 60);
    const res = timeout && !text ? { ok: false, reason: 'Время вышло' } : checkAnswer(text, qOf(g.ri, c.ti, c.qi));
    c.at.push([name, text, res.ok ? 1 : 0, res.reason || '']);
    c.tr.push(name);
    if (res.ok) { this.pl[name].score += c.v; g.ch = name; c.res = 'ok'; return this.reveal(); }
    this.pl[name].score -= c.v;
    c.an = null;
    if (c.cat || !this.online().some((n) => !c.tr.includes(n))) { c.res = 'none'; return this.reveal(); }
    this.openBuzz();
  }
  reveal() { this.phase('reveal', T.reveal, () => this.next()); }
  next() {
    const g = this.g;
    g.cur = null;
    if (g.used.some((u) => !u)) return this.phase('board');
    if (g.ri + 1 < DATA.rounds.length) return this.round(g.ri + 1);
    this.startFinal();
  }
  skipRound() {
    if (this.g.ph !== 'board') return;
    if (this.g.ri + 1 < DATA.rounds.length) this.round(this.g.ri + 1); else this.startFinal();
  }

  // --- финал ---
  startFinal() {
    const el = this.joined().filter((n) => this.pl[n].score > 0);
    this.g.cur = null;
    this.g.fin = { fi: Math.floor(Math.random() * DATA.finals.length), el, st: {}, an: {}, res: null };
    if (!el.length) { this.g.msg = 'Ни у кого нет положительного счёта, финал не играется.'; return this.phase('gameover'); }
    this.phase('finalStake', T.finalStake, () => this.finalAsk());
  }
  stake(name, a) {
    const f = this.g.fin;
    if (this.g.ph !== 'finalStake' || !f.el.includes(name) || f.st[name] != null) return;
    a = Math.floor(Number(a));
    if (!Number.isFinite(a)) return;
    f.st[name] = Math.max(1, Math.min(this.pl[name].score, a));
    if (f.el.every((n) => f.st[n] != null || !this.pl[n].on)) this.finalAsk(); else this.changed();
  }
  finalAsk() {
    const f = this.g.fin;
    for (const n of f.el) if (f.st[n] == null) f.st[n] = 1;
    this.phase('finalAnswer', T.finalAnswer + readTime(DATA.finals[f.fi].q), () => this.finalReveal());
  }
  fanswer(name, text) {
    const f = this.g.fin;
    if (this.g.ph !== 'finalAnswer' || !f.el.includes(name) || f.an[name] != null) return;
    f.an[name] = String(text || '').trim().slice(0, 60);
    if (f.el.every((n) => f.an[n] != null || !this.pl[n].on)) this.finalReveal(); else this.changed();
  }
  finalReveal() {
    if (this.g.ph !== 'finalAnswer') return;
    const f = this.g.fin, q = DATA.finals[f.fi];
    f.res = f.el.map((n) => {
      const text = f.an[n] ?? '';
      const r = text ? checkAnswer(text, q) : { ok: false };
      const d = r.ok ? f.st[n] : -f.st[n];
      this.pl[n].score += d;
      return [n, text, r.ok ? 1 : 0, f.st[n], d];
    });
    this.phase('gameover');
  }

  // --- снимок ---
  snapshot() { return { pl: this.pl, g: this.g, ok: this.ok }; }
  restore(s) {
    this.pl = s.pl; this.g = s.g; this.ok = s.ok || {}; this.rq = [];
    for (const n of NAMES) if (this.pl[n].peer !== 'local') this.pl[n].on = false;
    const ph = this.g.ph;
    if (['roundIntro', 'cat', 'reading', 'buzzing', 'answering', 'reveal'].includes(ph)) { this.g.cur = null; setTimeout(() => this.next(), 0); }
    else if (ph === 'finalStake') setTimeout(() => this.phase('finalStake', T.finalStake, () => this.finalAsk()), 0);
    else if (ph === 'finalAnswer') setTimeout(() => this.phase('finalAnswer', T.finalAnswer, () => this.finalReveal()), 0);
  }
  // Компактное публичное состояние (до 4 КБ): тексты вопросов берутся из страницы по номерам
  pub() {
    const g = this.g, c = g.cur, f = g.fin;
    return {
      rq: this.rq, ph: g.ph, ri: g.ri, used: g.used ? g.used.join('') : '', ch: g.ch, dl: g.dl, now: Date.now(), msg: g.msg,
      pl: NAMES.map((n) => [this.pl[n].score, this.pl[n].joined ? 1 : 0, this.pl[n].on ? 1 : 0, this.pl[n].peer]),
      cur: c ? { ti: c.ti, qi: c.qi, v: c.v, cat: c.cat ? 1 : 0, ct: c.ct, an: c.an, tr: c.tr, at: c.at, res: c.res } : null,
      fin: f ? { fi: f.fi, el: f.el, st: Object.keys(f.st), an: Object.keys(f.an), res: f.res } : null,
    };
  }
}

// ================= Состояние страницы =================
const app = {
  mode: null,       // 'local' | 'host' | 'client'
  game: null,       // Game у ведущего и в режиме одного телефона
  P: null,          // публичное состояние
  offset: 0,
  me: null,         // имя игрока на этом телефоне
  myPeer: null,
  room: null, lobby: null, gameRoom: null, code: null,
  seq: 0, lastSeq: {}, hostSeen: false, games: [],
  phaseSeenAt: 0, localStakeIdx: 0,
};
const $ = (s) => document.querySelector(s);
const main = $('#main');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---------- Звук ----------
let actx;
function beep(f = 600, d = 0.12, type = 'sine', vol = 0.14) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) { /* без звука */ }
}
const sfx = {
  open: () => beep(880, 0.15, 'square', 0.07),
  buzz: () => { beep(520, 0.1, 'sawtooth'); setTimeout(() => beep(780, 0.15, 'sawtooth'), 90); },
  good: () => { beep(660, 0.12); setTimeout(() => beep(990, 0.2), 120); },
  bad: () => beep(180, 0.35, 'sawtooth', 0.11),
};
let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* не дали */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && app.mode) keepAwake(); });

// ---------- Действия игрока ----------
function act(k, d) {
  if (app.mode === 'client') {
    app.seq += 1;
    app.gameRoom?.presence({ a: { n: app.seq, k, d: d ?? null } }).catch(() => toast('Нет связи с комнатой'));
  } else if (app.game) {
    hostAct(app.mode === 'host' ? app.myPeer || 'host' : 'local', k, d, true);
  }
}
// Ведущий применяет действие. peer — кто прислал; имя определяем по владельцу.
function hostAct(peer, k, d, self) {
  const G = app.game;
  if (!G) return;
  const nameOf = () => (self && app.mode === 'local') ? null : NAMES.find((n) => G.pl[n].peer === peer && G.pl[n].on);
  if (k === 'approve' || k === 'deny') { if (self) G.approve(d, k === 'approve'); return; }
  if (k === 'join') {
    const err = G.join(String(d), peer, self);
    if (err && self) toast(err);
    return;
  }
  let name = nameOf();
  if (self && app.mode === 'local') name = d?.who || '*';
  if (!name) return;
  switch (k) {
    case 'start': G.start(); break;
    case 'pick': G.pick(name, d.ti, d.qi); break;
    case 'cat': G.catGive(name, d.to); break;
    case 'buzz': G.buzz(name, d?.rt); break;
    case 'answer': G.answer(name, d.text); break;
    case 'stake': G.stake(name, d.a); break;
    case 'fans': G.fanswer(name, d.text); break;
    case 'skip': G.skipRound(); break;
    case 'adjust': if (name === SCORE_EDITOR || app.mode === 'local') G.adjust(String(d.name), Number(d.delta)); break;
    case 'setScore': if (name === SCORE_EDITOR || app.mode === 'local') G.setScore(String(d.name), Number(d.value)); break;
    case 'new': if (G.g.ph === 'gameover' || G.g.ph === 'lobby') G.reset(false), G.changed(); break;
    case 'abort': if (self) { G.reset(false); G.changed(); } break;
  }
}

function onGameChange() {
  const G = app.game;
  app.P = G.pub();
  app.offset = 0;
  if (app.mode === 'host') {
    store.set('host', { code: app.code, snap: G.snapshot(), at: Date.now() });
    app.gameRoom?.presence({ host: 1, s: app.P }).catch((e) => console.warn(e));
  } else {
    store.set('local', { snap: G.snapshot(), at: Date.now() });
  }
  stateArrived();
}

// ================= Комнаты (онлайн) =================
async function initRoom() {
  try {
    const room = window.MG_ROOM ? window.MG_ROOM() : await window.claude?.use?.('room');
    if (!room) return;
    app.room = room;
    if (!app.mode) render(true);
  } catch (e) { app.room = null; }
}

async function joinGameRoom(code) {
  const r = await app.room.join('mg-' + code);
  app.gameRoom = r;
  app.code = code;
  r.onPeers((ch) => {
    const mine = ch.peers.find((p) => p.sameTab);
    if (mine) app.myPeer = mine.peer;
    if (app.mode === 'host') {
      for (const p of [...ch.joined, ...ch.updated]) {
        if (p.sameTab) continue;
        const a = p.presence?.a;
        if (a && typeof a.n === 'number' && a.n > (app.lastSeq[p.peer] || 0)) {
          app.lastSeq[p.peer] = a.n;
          hostAct(p.peer, String(a.k), a.d, false);
        }
      }
      for (const p of ch.left) app.game.dropPeer(p.peer);
      for (const p of ch.joined) app.game.markPeer(p.peer);
      if (app.myPeer) for (const n of NAMES) if (app.game.pl[n].peer === 'host') app.game.pl[n].peer = app.myPeer;
    } else {
      const host = ch.peers.find((p) => p.presence?.host && p.presence?.s);
      if (host) {
        app.hostSeen = true;
        if (host.presence.s !== app.lastS) {
          app.lastS = host.presence.s;
          app.P = host.presence.s;
          app.offset = app.P.now - Date.now();
          // Восстановить имя после перезагрузки
          if (app.me && app.myPeer && app.P.pl[NAMES.indexOf(app.me)][3] !== app.myPeer && !app.joinTried) {
            app.joinTried = true; act('join', app.me);
          }
          stateArrived();
        }
      } else if (app.hostSeen) {
        app.hostSeen = false; app.P = null; render(true);
      }
    }
  }, (e) => { toast('Комната закрылась: ' + e.code); });
  return r;
}

function connecting(on) {
  if (on) { viewKey = 'connecting'; main.innerHTML = '<div class="logo">МОЯ ИГРА</div><p class="status">Подключаемся…</p>'; }
  else viewKey = '';
}

async function hostOnline(saved) {
  if (!app.room) return toast('Онлайн недоступен');
  const code = saved?.code || String(100000 + Math.floor(Math.random() * 900000));
  connecting(true);
  app.mode = 'host';
  app.game = new Game(onGameChange, saved?.snap);
  try { await joinGameRoom(code); } catch (e) { app.mode = null; app.game.clear(); app.game = null; app.P = null; connecting(false); render(true); return toast('Нет связи. Проверь интернет и попробуй ещё раз'); }
  connecting(false);
  try { history.replaceState(null, '', '#g' + code); } catch (e) { /* без адреса */ }
  keepAwake();
  onGameChange();
}

async function joinOnline(code) {
  code = String(code || '').replace(/\D/g, '').slice(0, 6);
  if (code.length < 4) return toast('Введи код игры (цифры)');
  if (!app.room) return toast('Онлайн недоступен');
  app.mode = 'client';
  app.P = null; app.hostSeen = false; app.joinTried = false;
  store.set('client', { code, me: app.me, at: Date.now() });
  connecting(true);
  try { await joinGameRoom(code); } catch (e) { app.mode = null; connecting(false); render(true); return toast('Нет связи. Проверь интернет и попробуй ещё раз'); }
  connecting(false);
  keepAwake();
  render(true);
}

function startLocal(saved) {
  app.mode = 'local';
  app.me = null;
  app.game = new Game(onGameChange, saved?.snap);
  keepAwake();
  onGameChange();
}

function exitToMenu() {
  if (app.mode === 'host') { app.gameRoom?.presence({ host: null, s: null }).catch(() => {}); store.del('host'); app.game?.clear(); }
  if (app.mode === 'local') { store.del('local'); app.game?.clear(); }
  if (app.mode === 'client') store.del('client');
  app.gameRoom?.leave().catch(() => {});
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* без адреса */ }
  app.hashCode = null;
  Object.assign(app, { mode: null, game: null, P: null, gameRoom: null, code: null, me: null, lastSeq: {}, hostSeen: false, seq: 0 });
  render(true);
}

// ================= Отрисовка =================
let viewKey = '', prevPh = null, prevAt = 0;
function stateArrived() {
  const P = app.P;
  if (P && P.ph !== prevPh) {
    app.phaseSeenAt = performance.now();
    if (P.ph === 'buzzing') sfx.open();
    if (P.ph === 'answering') sfx.buzz();
    if (P.ph === 'reveal') (P.cur?.res === 'ok' ? sfx.good : sfx.bad)();
    if (P.ph === 'answering' && P.cur?.an === myName()) navigator.vibrate?.([60, 40, 120]);
  }
  if (P?.cur && P.cur.at.length > prevAt && P.ph === 'buzzing') sfx.bad();
  prevAt = P?.cur?.at.length || 0;
  prevPh = P?.ph;
  render();
}

function myName() {
  if (app.mode === 'local') return null;
  if (!app.P) return null;
  const peer = app.mode === 'host' ? (app.myPeer || 'host') : app.myPeer;
  const i = app.P.pl.findIndex((p) => p[3] === peer && p[2]);
  return i >= 0 ? NAMES[i] : null;
}
const players = () => app.P ? NAMES.map((n, i) => ({ name: n, score: app.P.pl[i][0], joined: !!app.P.pl[i][1], on: !!app.P.pl[i][2], peer: app.P.pl[i][3], color: COLORS[i] })) : [];

function renderScores() {
  const box = $('#scores');
  const P = app.P;
  if (!P || P.ph === 'lobby' && app.mode !== 'local' && !myName()) { box.innerHTML = ''; return; }
  const me = myName();
  box.innerHTML = players().map((p) => {
    const cls = ['score'];
    if (p.name === me) cls.push('me');
    if (P.ch === p.name && ['board', 'cat', 'roundIntro'].includes(P.ph)) cls.push('chooser');
    if (P.ph === 'answering' && P.cur?.an === p.name) cls.push('answering');
    if (!p.joined) cls.push('absent'); else if (!p.on) cls.push('off');
    return `<div class="${cls.join(' ')}"><div class="n">${esc(p.name)}</div><div class="s ${p.score < 0 ? 'neg' : ''}">${p.score}</div></div>`;
  }).join('');
}

function render(force) {
  renderScores();
  renderScoreEdit();
  const P = app.P;
  let key, view;
  if (!app.mode) { key = 'menu' + !!app.room; view = viewMenu; }
  else if (!P) { key = 'wait' + app.hostSeen; view = viewWaitHost; }
  else if (app.mode !== 'local' && !myName() && P.ph === 'lobby') { key = 'choose' + P.pl.map((p) => p[2] + p[3]).join(); view = viewChoose; }
  else {
    const c = P.cur, f = P.fin;
    key = P.ph + '|' + myName() + '|' + P.ri;
    switch (P.ph) {
      case 'lobby': key += P.pl.map((p) => p.join()).join(); break;
      case 'board': key += P.used + P.ch + P.pl.map((p) => p[2]).join(); break;
      case 'cat': key += P.ch + P.pl.map((p) => p[2]).join(); break;
      case 'reading': case 'buzzing': case 'answering': case 'reveal': key += c.ti + ',' + c.qi + c.an + c.at.length + c.tr.join(); break;
      case 'finalStake': key += f.st.join(); break;
      case 'finalAnswer': key += f.an.join(); break;
      case 'gameover': key += JSON.stringify(f?.res) + P.msg; break;
    }
    if (!myName() && app.mode !== 'local') key += P.pl.map((p) => p[2] + p[3]).join();
    view = { lobby: viewLobby, roundIntro: viewRoundIntro, board: viewBoard, cat: viewCat, reading: viewQuestion, buzzing: viewQuestion, answering: viewQuestion, reveal: viewQuestion, finalStake: viewFinalStake, finalAnswer: viewFinalAnswer, gameover: viewGameOver }[P.ph];
    if (!myName() && app.mode !== 'local' && P.ph !== 'lobby') { key = 'late' + key; view = viewLate; }
  }
  const rq = app.mode === 'host' && P?.rq?.length ? P.rq : null;
  const pending = app.mode === 'client' && P?.rq?.some((r) => r[1] === app.myPeer);
  key += '|' + JSON.stringify(rq) + pending;
  if (!force && key === viewKey) return;
  viewKey = key;
  const focused = document.activeElement?.id;
  const keep = focused ? document.getElementById(focused)?.value : null;
  main.innerHTML = (rq ? requestsHtml(rq) : '') + (pending ? viewPending() : view());
  bind();
  const el = focused && document.getElementById(focused);
  if (el) { if (keep && 'value' in el && !el.value) el.value = keep; el.focus(); }
}

// ---------- Таймер ----------
let tStart = { key: null, total: 1 };
function tick() {
  const fill = $('#timerFill'), P = app.P;
  if (P && P.dl) {
    const now = Date.now() + app.offset;
    const key = P.ph + P.dl;
    if (tStart.key !== key) tStart = { key, total: Math.max(1000, P.dl - now) };
    const left = Math.max(0, P.dl - now);
    fill.style.width = (100 * left / tStart.total) + '%';
    fill.classList.toggle('warn', left < 4000 && ['buzzing', 'answering', 'finalAnswer', 'finalStake', 'cat'].includes(P.ph));
    document.querySelectorAll('[data-secs]').forEach((el) => { el.textContent = Math.ceil(left / 1000); });
  } else fill.style.width = '0';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- Обработчики ----------
function bind() {
  main.querySelectorAll('[data-join]').forEach((b) => b.onclick = () => {
    app.me = b.dataset.join;
    if (app.mode === 'client') { store.set('client', { code: app.code, me: app.me, at: Date.now() }); app.joinTried = true; }
    act('join', app.me);
  });
  main.querySelectorAll('[data-appr]').forEach((b) => b.onclick = () => act('approve', b.dataset.appr));
  main.querySelectorAll('[data-deny]').forEach((b) => b.onclick = () => act('deny', b.dataset.deny));
  main.querySelectorAll('[data-sel]').forEach((b) => b.onclick = () => {
    const n = b.dataset.sel;
    localSel = localSel.includes(n) ? localSel.filter((x) => x !== n) : NAMES.filter((x) => x === n || localSel.includes(x));
    render(true);
  });
  main.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
    const [ti, qi] = b.dataset.pick.split(',').map(Number);
    act('pick', { ti, qi, who: app.P.ch });
  });
  main.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => act('cat', { to: b.dataset.cat, who: app.P.ch }));
  main.querySelectorAll('[data-lbuzz]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); act('buzz', { who: b.dataset.lbuzz, rt: 0 }); }));
  const actions = {
    host: () => { store.del('host'); hostOnline(null); },
    hostResume: () => hostOnline(store.get('host')),
    join: () => joinOnline($('#code').value),
    joinCode: (b) => joinOnline(b.dataset.code),
    local: () => { store.del('local'); localSel = null; startLocal(null); },
    localResume: () => startLocal(store.get('local')),
    exit: exitToMenu,
    start: () => { if (app.mode === 'local') app.game.setLocalPlayers(localSel); act('start', {}); },
    buzz: () => act('buzz', { rt: Math.round(performance.now() - app.phaseSeenAt) }),
    send: sendAnswer,
    stake: (b) => act('stake', { a: Number($('#stake').value), who: b.dataset.who }),
    fans: (b) => { const v = $('#fans').value.trim(); if (!v) return toast('Впиши ответ'); act('fans', { text: v, who: b.dataset.who }); },
    new: () => act('new', {}),
    copy: () => {
      const inp = $('#invite');
      navigator.clipboard?.writeText(inp.value).then(() => toast('Ссылка скопирована'), () => { inp.select(); toast('Выдели и скопируй ссылку'); });
    },
    share: () => {
      if (navigator.share) navigator.share({ title: 'Моя игра', text: 'Заходи в «Мою игру»!', url: inviteUrl() }).catch(() => {});
      else { $('#invite').select(); toast('Скопируй ссылку и отправь'); }
    },
  };
  main.querySelectorAll('[data-a]').forEach((b) => {
    const h = actions[b.dataset.a];
    if (!h) return;
    if (b.dataset.a === 'buzz') b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.disabled = true; h(b); });
    else b.onclick = () => h(b);
  });
  const ans = $('#ans');
  if (ans) { ans.focus(); ans.onkeydown = (e) => { if (e.key === 'Enter') sendAnswer(); }; }
  const code = $('#code');
  if (code) code.onkeydown = (e) => { if (e.key === 'Enter') joinOnline(code.value); };
}
function sendAnswer() {
  const v = $('#ans')?.value.trim();
  if (!v) return toast('Впиши ответ');
  act('answer', { text: v, who: app.P.cur.an });
}
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && app.P?.ph === 'buzzing' && app.mode !== 'local' && document.activeElement?.tagName !== 'INPUT') {
    e.preventDefault();
    if (!app.P.cur.tr.includes(myName())) actions_buzz();
  }
});
function actions_buzz() { act('buzz', { rt: Math.round(performance.now() - app.phaseSeenAt) }); }

// ---------- Меню ----------
$('#menuBtn').onclick = () => {
  $('#menuWho').textContent = !app.mode ? 'Главное меню' : app.mode === 'local' ? 'Один телефон на всех' : (myName() ? 'Ты: ' + myName() : 'Онлайн') + (app.code ? ' · игра ' + app.code : '');
  $('#scoresBtn').hidden = !canEditScores();
  $('#menu').hidden = false;
};
function canEditScores() { return !!app.P && (app.mode === 'local' || myName() === SCORE_EDITOR); }
function renderScoreEdit() {
  const box = $('#scoreEditBox');
  if ($('#scoreEdit').hidden || !app.P) return;
  const keepId = document.activeElement?.id, keepVal = keepId ? document.getElementById(keepId)?.value : null;
  box.innerHTML = `<h2>Баллы игроков</h2>
    ${players().filter((p) => p.joined).map((p, i) => `
      <div class="edit-row">
        <span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span>
        <div class="edit-btns">
          <button class="minus" data-adj="${esc(p.name)}" data-d="-500">−500</button>
          <button class="minus" data-adj="${esc(p.name)}" data-d="-100">−100</button>
          <button data-adj="${esc(p.name)}" data-d="100">+100</button>
          <button data-adj="${esc(p.name)}" data-d="500">+500</button>
        </div>
        <div class="edit-set"><input id="set${i}" type="number" inputmode="numeric" placeholder="Точное число"><button data-set="${esc(p.name)}" data-inp="set${i}">Поставить</button></div>
      </div>`).join('') || '<p class="sub">Пока нет игроков</p>'}
    <button class="ghost" data-close="1">Готово</button>`;
  if (keepId && document.getElementById(keepId)) { const el = document.getElementById(keepId); el.value = keepVal || ''; el.focus(); }
}
$('#scoreEdit').onclick = (e) => {
  const t = e.target;
  if (t.id === 'scoreEdit' || t.dataset.close) { $('#scoreEdit').hidden = true; return; }
  if (t.dataset.adj) act('adjust', { name: t.dataset.adj, delta: Number(t.dataset.d) });
  if (t.dataset.set) {
    const v = document.getElementById(t.dataset.inp).value;
    if (v === '' || !Number.isFinite(Number(v))) return toast('Впиши число');
    document.getElementById(t.dataset.inp).value = '';
    act('setScore', { name: t.dataset.set, value: Number(v) });
  }
};
let abortArmed = false;
$('#menu').onclick = (e) => {
  const m = e.target.dataset?.m;
  if (e.target.id === 'menu' || m === 'close') { $('#menu').hidden = true; return; }
  if (!m) return;
  if (m === 'scores') {
    $('#menu').hidden = true;
    $('#scoreEdit').hidden = false;
    renderScoreEdit();
    return;
  }
  if (m === 'skipRound') {
    if (app.P?.ph !== 'board') return toast('Можно, когда открыто табло');
    act('skip', { who: app.P.ch });
  } else if (m === 'exit') exitToMenu();
  else if (m === 'abort') {
    if (!abortArmed) { abortArmed = true; e.target.textContent = 'Точно? Нажми ещё раз'; setTimeout(() => { abortArmed = false; e.target.textContent = 'Начать игру заново (лобби)'; }, 3000); return; }
    abortArmed = false; e.target.textContent = 'Начать игру заново (лобби)';
    act('abort', {});
  }
  $('#menu').hidden = true;
};

// ---------- Запуск ----------
function boot() {
  const m = /^#g(\d{4,6})$/.exec(location.hash);
  if (m) app.hashCode = m[1];
  render(true);
  initRoom().then(() => {
    const cs = store.get('client');
    if (!app.mode && cs && Date.now() - (cs.at || Date.now()) < 6 * 3600e3 && app.room && cs.me) { app.me = cs.me; }
    if (!app.mode && app.room && app.hashCode) {
      const hs = store.get('host');
      if (hs && hs.code === app.hashCode) hostOnline(hs); else joinOnline(app.hashCode);
    }
  });
}
boot();
</script>

</body>

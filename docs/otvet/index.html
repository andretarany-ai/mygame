<script>// Связь между телефонами для версии на GitHub Pages: тот же интерфейс, что у «комнат» claude.ai
// (join → presence / onPeers / leave), но через публичный MQTT-брокер. Регистрация не нужна.
(function () {
  // Первый — на обычном порту 443 (проходит через большинство сетей), остальные — запасные
  const BROKERS = window.MG_BROKERS || [
    { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' },
    { url: 'wss://broker.emqx.io:8084/mqtt' },
    { url: 'wss://broker.hivemq.com:8884/mqtt' },
  ];
  const PREFIX = 'moyaigra-v1-k7q2/';
  const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  const me = rid();

  function connect(list, opts) {
    return new Promise((resolve, reject) => {
      let i = 0;
      const tryNext = () => {
        if (i >= list.length) return reject(new Error('no broker'));
        const b = typeof list[i] === 'string' ? { url: list[i] } : list[i];
        i += 1;
        const o = { ...opts };
        if (b.username) { o.username = b.username; o.password = b.password; }
        const c = window.mqtt.connect(b.url, o);
        const t = setTimeout(() => { c.end(true); tryNext(); }, 7000);
        c.once('connect', () => { clearTimeout(t); resolve(c); });
      };
      tryNext();
    });
  }

  async function join(name) {
    const base = PREFIX + name + '/p/';
    const myTopic = base + me;
    let mine = {};
    const peers = new Map();
    const handlers = [];
    let first = true, sched = false, left = false;
    let pend = { joined: [], left: [], updated: [] };
    const mk = (peer, presence) => Object.freeze({ peer, presence: Object.freeze(presence), sameTab: peer === me, isMe: peer === me, by: null, kind: 'viewer', guest: false, updatedAt: Date.now() });
    peers.set(me, mk(me, {}));

    function fire() {
      if (sched) return;
      sched = true;
      setTimeout(() => {
        sched = false;
        const all = [...peers.values()];
        const ch = first ? { peers: all, joined: all, left: [], updated: [] } : { peers: all, ...pend };
        first = false;
        pend = { joined: [], left: [], updated: [] };
        handlers.forEach((h) => { try { h(ch); } catch (e) { console.error(e); } });
      }, 10);
    }

    const client = await connect(BROKERS, {
      clientId: 'mg_' + me + '_' + rid().slice(0, 4),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 7000,
      will: { topic: myTopic, payload: '', retain: true, qos: 1 },
    });

    const announce = () => client.publish(myTopic, JSON.stringify(mine), { retain: true, qos: 1 });
    client.on('connect', () => { client.subscribe(base + '+', { qos: 1 }); announce(); });
    client.subscribe(base + '+', { qos: 1 });
    announce();

    client.on('message', (topic, buf) => {
      if (!topic.startsWith(base)) return;
      const peer = topic.slice(base.length);
      if (peer === me) return;
      const txt = buf.toString();
      if (!txt) {
        const o = peers.get(peer);
        if (o) { peers.delete(peer); pend.left.push(o); fire(); }
        return;
      }
      let pr;
      try { pr = JSON.parse(txt); } catch (e) { return; }
      if (!pr || typeof pr !== 'object') return;
      const had = peers.has(peer);
      const o = mk(peer, pr);
      peers.set(peer, o);
      (had ? pend.updated : pend.joined).push(o);
      fire();
    });

    const bye = () => { try { client.publish(myTopic, '', { retain: true, qos: 0 }); } catch (e) { /* закрываемся */ } };
    addEventListener('pagehide', bye);

    return {
      name,
      presence(patch) {
        if (left) return Promise.reject({ code: 'invalid_argument', message: 'left' });
        mine = { ...mine };
        for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = JSON.parse(JSON.stringify(patch[k])); }
        const o = mk(me, mine);
        peers.set(me, o);
        pend.updated.push(o);
        fire();
        announce();
        return Promise.resolve();
      },
      onPeers(h) { handlers.push(h); fire(); return () => { const i = handlers.indexOf(h); if (i >= 0) handlers.splice(i, 1); }; },
      peers: () => [...peers.values()],
      emit: () => Promise.resolve(),
      on: () => () => {},
      connected: () => client.connected,
      onConnection(h) { client.on('connect', () => h(true)); client.on('offline', () => h(false)); return () => {}; },
      leave() {
        left = true;
        removeEventListener('pagehide', bye);
        return new Promise((res) => client.publish(myTopic, '', { retain: true, qos: 1 }, () => { client.end(false, {}, res); }));
      },
    };
  }

  window.MG_BUILD = 'pages';
  window.MG_ROOM = () => (window.mqtt ? { join } : null);
})();
</script>

// ---------- Случай ----------
function rnd(n) {
  const c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : require('crypto').webcrypto;
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do c.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (arr, n) => shuffle(arr).slice(0, n);

const T = { whoVote: 25000, funnyWrite: 60000, funnyVote: 30000, drawTime: 180000, descTime: 60000, ideaWrite: 75000, ideaGen: 90000, ideaGuess: 60000, grace: 2500 };
const cleanText = (t, max = 120) => String(t ?? '').replace(/\s+/g, ' ').trim().slice(0, max);

// Рисунок: [{c: 'цвет', w: толщина, p: [x,y,x,y…]}], координаты 0…1000. Проверяем и ограничиваем размер.
function cleanDrawing(d) {
  if (!Array.isArray(d)) return [];
  const out = [];
  let pts = 0;
  for (const s of d.slice(0, 400)) {
    if (!s || !Array.isArray(s.p)) continue;
    const p = s.p.slice(0, 2000).map((v) => Math.max(0, Math.min(1000, Math.round(Number(v) || 0))));
    if (p.length < 2) continue;
    pts += p.length;
    if (pts > 24000) break;
    out.push({ c: /^#[0-9a-f]{6}$/i.test(s.c) ? s.c : '#111111', w: Math.max(2, Math.min(60, Math.round(Number(s.w) || 8))), p });
  }
  return out;
}

class Party {
  constructor(mode, onChange, saved) {
    this.mode = mode;
    this.onChange = onChange;
    this.timer = null;
    this.drafts = {};
    if (saved) this.restore(saved); else this.reset(true);
  }
  reset(full) {
    clearTimeout(this.timer);
    const old = this.pl;
    this.pl = {};
    for (const n of PLAYERS) this.pl[n] = { joined: !full && !!old?.[n]?.joined, on: !full && !!old?.[n]?.on, peer: full ? null : old?.[n]?.peer ?? null };
    this.g = { ph: 'lobby', players: [], step: null, dl: null, scores: {}, ev: [], evId: 0, opt: this.g?.opt || {} };
    this.rq = this.rq || [];
    this.ok = this.ok || {};
  }
  changed() { this.onChange && this.onChange(); }
  ev(k, d) { const g = this.g; g.ev.push({ id: ++g.evId, k, ...d }); if (g.ev.length > 20) g.ev.shift(); }
  setTimer(ms, fn) { clearTimeout(this.timer); this.g.dl = ms ? Date.now() + ms : null; if (ms) this.timer = setTimeout(fn, ms + T.grace); }
  inGame(n) { return this.g.players.includes(n); }

  // --- вход по ссылке ---
  join(name, peer, trusted) {
    const p = this.pl[name];
    if (!p) return 'Нет такого игрока';
    if (p.on && p.peer && p.peer !== peer) return name + ' уже играет на другом телефоне';
    if (!trusted && !this.ok[peer]) { this.rq = this.rq.filter((r) => r[1] !== peer).concat([[name, peer]]).slice(-8); this.changed(); return null; }
    for (const n of PLAYERS) if (n !== name && this.pl[n].peer === peer) { this.pl[n].on = false; this.pl[n].peer = null; }
    Object.assign(p, { joined: true, on: true, peer });
    this.changed();
    return null;
  }
  approve(peer, yes) {
    const r = this.rq.find((x) => x[1] === peer);
    this.rq = this.rq.filter((x) => x[1] !== peer);
    if (r && yes) { this.ok[peer] = 1; this.join(r[0], peer, true); } else this.changed();
  }
  dropPeer(peer) {
    let ch = false;
    for (const n of PLAYERS) if (this.pl[n].peer === peer && this.pl[n].on) { this.pl[n].on = false; ch = true; }
    if (this.rq.some((r) => r[1] === peer)) { this.rq = this.rq.filter((r) => r[1] !== peer); ch = true; }
    if (ch) { this.changed(); this.checkAllDone(); }
  }
  markPeer(peer) {
    let ch = false;
    for (const n of PLAYERS) if (this.pl[n].peer === peer && this.pl[n].joined && !this.pl[n].on) { this.pl[n].on = true; ch = true; }
    if (ch) this.changed();
  }
  online() { return this.g.players.filter((n) => this.pl[n].on); }
  // Черновик игрока (текст или рисунок), присланный заранее — забираем, если время вышло
  setDraft(n, key, v) { if (n) this.drafts[n] = { key, v }; }
  draftOf(n, key) { const d = this.drafts[n]; return d && d.key === key ? d.v : null; }

  // --- старт ---
  start(opt = {}) {
    const js = PLAYERS.filter((n) => this.pl[n].joined && this.pl[n].on);
    if (this.g.ph !== 'lobby' && this.g.ph !== 'end') return;
    if (js.length < 2) return;
    const g = this.g;
    Object.assign(g, { ph: 'game', players: shuffle(js), scores: Object.fromEntries(js.map((n) => [n, 0])), opt: { ...g.opt, ...opt } });
    this.drafts = {};
    if (this.mode === 'who') this.whoStart();
    if (this.mode === 'funny') this.funnyStart();
    if (this.mode === 'draw') this.drawStart();
    if (this.mode === 'idea') this.ideaStart();
  }
  toLobby() { clearTimeout(this.timer); Object.assign(this.g, { ph: 'lobby', step: null, dl: null, w: null, f: null, d: null }); this.changed(); }
  // Все, кто на связи, уже сделали ход — не ждём таймер
  checkAllDone() {
    if (this.g.ph !== 'game') return;
    if (this.mode === 'who' && this.g.step === 'vote' && this.online().every((n) => this.g.w.votes[n])) this.whoReveal();
    if (this.mode === 'funny') {
      const f = this.g.f;
      if (this.g.step === 'write' && this.online().every((n) => f.answers[n] != null)) this.funnyToVote();
      else if (this.g.step === 'vote' && this.online().every((n) => f.votes[n] || !this.funnyCanVote(n))) this.funnyReveal();
    }
    if (this.mode === 'idea') {
      const i = this.g.i;
      if (this.g.step === 'write' && this.online().every((n) => i.ideas[n] != null)) this.ideaToGen();
      else if (this.g.step === 'gen' && i.order.every((a) => i.imgs[a])) this.ideaToGuess();
      else if (this.g.step === 'guess' && this.online().every((n) => i.sent[n] || !i.order.some((a) => a !== n))) this.ideaReveal();
    }
    if (this.mode === 'draw' && ['s1', 's2', 's3', 's4'].includes(this.g.step)) {
      const d = this.g.d, s = Number(this.g.step[1]);
      if (this.online().every((n) => d.done[n])) this.drawEndStep(s);
    }
  }

  // ================= «Кто из нас?» =================
  whoStart() {
    const count = Math.min(WHO_Q.length, Number(this.g.opt.rounds) || 10);
    this.g.w = { qs: pick(WHO_Q.map((_, i) => i), count), qi: 0, votes: {}, res: null, titles: {} };
    this.whoAsk();
  }
  whoAsk() { const g = this.g; g.step = 'vote'; g.w.votes = {}; g.w.res = null; this.setTimer(T.whoVote, () => this.whoReveal()); this.changed(); }
  whoVote(n, t) {
    const g = this.g;
    if (g.step !== 'vote' || !this.inGame(n) || !this.inGame(t) || g.w.votes[n]) return;
    g.w.votes[n] = t;
    this.changed();
    this.checkAllDone();
  }
  whoReveal() {
    const g = this.g, w = g.w;
    if (g.step !== 'vote') return;
    clearTimeout(this.timer); g.dl = null;
    const counts = Object.fromEntries(g.players.map((n) => [n, 0]));
    for (const v of Object.values(w.votes)) counts[v]++;
    const max = Math.max(0, ...Object.values(counts));
    const top = max ? g.players.filter((n) => counts[n] === max) : [];
    const right = Object.keys(w.votes).filter((v) => top.includes(w.votes[v]));
    for (const n of right) g.scores[n] += 1;
    for (const n of top) (w.titles[n] = w.titles[n] || []).push(w.qs[w.qi]);
    w.res = { counts, top, right, votes: { ...w.votes } };
    g.step = 'reveal';
    this.ev('reveal', {});
    this.changed();
  }
  whoNext() {
    const g = this.g, w = g.w;
    if (g.step !== 'reveal') return;
    if (w.qi + 1 >= w.qs.length) return this.finish();
    w.qi++;
    this.whoAsk();
  }

  // ================= «Смешной ответ» =================
  funnyStart() {
    const count = Number(this.g.opt.rounds) || 5;
    this.g.f = { qs: pick(FUNNY_Q.map((_, i) => i), count), r: 0, answers: {}, order: [], votes: {}, res: null };
    this.funnyAsk();
  }
  funnyKey() { return 'f' + this.g.f.r; }
  funnyAsk() { const g = this.g; g.step = 'write'; Object.assign(g.f, { answers: {}, order: [], votes: {}, res: null }); this.setTimer(T.funnyWrite, () => this.funnyToVote()); this.changed(); }
  funnyAnswer(n, text) {
    const g = this.g;
    if (g.step !== 'write' || !this.inGame(n) || g.f.answers[n] != null) return;
    const t = cleanText(text);
    if (!t) return;
    g.f.answers[n] = t;
    this.changed();
    this.checkAllDone();
  }
  funnyToVote() {
    const g = this.g, f = g.f;
    if (g.step !== 'write') return;
    for (const n of g.players) if (f.answers[n] == null) { const d = cleanText(this.draftOf(n, this.funnyKey())); if (d) f.answers[n] = d; }
    f.order = shuffle(Object.keys(f.answers));
    if (f.order.length < 2) { f.res = { pts: {}, smash: null, empty: true }; g.step = 'reveal'; clearTimeout(this.timer); g.dl = null; return this.changed(); }
    g.step = 'vote';
    this.setTimer(T.funnyVote, () => this.funnyReveal());
    this.changed();
  }
  funnyCanVote(n) { return this.g.f.order.some((a) => a !== n); }
  funnyVote(n, author) {
    const g = this.g, f = g.f;
    if (g.step !== 'vote' || !this.inGame(n) || f.votes[n] || author === n || !f.order.includes(author)) return;
    f.votes[n] = author;
    this.changed();
    this.checkAllDone();
  }
  funnyReveal() {
    const g = this.g, f = g.f;
    if (g.step !== 'vote') return;
    clearTimeout(this.timer); g.dl = null;
    const cnt = Object.fromEntries(f.order.map((a) => [a, 0]));
    for (const a of Object.values(f.votes)) cnt[a]++;
    const voters = Object.keys(f.votes).length;
    const pts = {};
    let smash = null;
    for (const a of f.order) {
      pts[a] = cnt[a] * 100;
      const possible = g.players.filter((n) => n !== a && f.votes[n] !== undefined).length;
      if (voters >= 2 && cnt[a] === possible && possible >= 2) { pts[a] += 200; smash = a; }
      g.scores[a] = (g.scores[a] || 0) + pts[a];
    }
    f.res = { cnt, pts, smash, votes: { ...f.votes } };
    g.step = 'reveal';
    this.ev('reveal', { smash });
    this.changed();
  }
  funnyNext() {
    const g = this.g, f = g.f;
    if (g.step !== 'reveal') return;
    if (f.r + 1 >= f.qs.length) return this.finish();
    f.r++;
    this.funnyAsk();
  }

  // ================= «Испорченный рисунок» =================
  // Цепочка: слово → рисунок → описание → рисунок → описание. Шаг s в цепочке k делает игрок players[(k+s) mod N].
  drawStart() {
    const g = this.g, N = g.players.length;
    const words = pick(DRAW_W, N);
    g.d = { chains: g.players.map((n, k) => [{ t: 'word', v: words[k], by: n }]), done: {}, rv: null, likes: {} };
    this.drawStep(1);
  }
  drawWho(k, s) { const N = this.g.players.length; return this.g.players[(k + s) % N]; }
  drawTask(n) {
    // какую цепочку игрок n делает на текущем шаге
    const g = this.g, s = Number(g.step?.[1]), N = g.players.length, i = g.players.indexOf(n);
    if (!s || i < 0) return null;
    const k = ((i - s) % N + N) % N;
    return { k, s, type: s % 2 ? 'draw' : 'text', prev: g.d.chains[k][s - 1] };
  }
  drawStep(s) {
    const g = this.g;
    g.step = 's' + s;
    g.d.done = {};
    const ms = s % 2 ? (Number(g.opt.drawSec) || T.drawTime / 1000) * 1000 : T.descTime;
    this.setTimer(ms, () => this.drawEndStep(s));
    this.ev('step', { s });
    this.changed();
  }
  drawSubmit(n, v) {

    const task = this.drawTask(n);

// ================= Холст для рисования =================
const COLORS = ['#111111', '#ffffff', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#f06292', '#8d6e63'];
const WIDTHS = [5, 12, 26];
function paint(ctx, size, strokes, upto) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  const k = size / 1000;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let left = upto ?? Infinity;
  for (const s of strokes) {
    if (left <= 0) break;
    const p = s.p, n = Math.min(p.length / 2, left);
    left -= p.length / 2;
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w * k;
    ctx.beginPath();
    ctx.moveTo(p[0] * k, p[1] * k);
    if (n === 1) ctx.lineTo(p[0] * k + 0.01, p[1] * k);
    for (let i = 1; i < n; i++) ctx.lineTo(p[i * 2] * k, p[i * 2 + 1] * k);
    ctx.stroke();
  }
}
// Нарисовать готовый рисунок (с анимацией «перерисовки» по желанию)
function showDrawing(cv, strokes, animate) {
  const dpr = Math.min(2, devicePixelRatio || 1), size = Math.round((cv.clientWidth || 300) * dpr);
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const total = strokes.reduce((a, s) => a + s.p.length / 2, 0);
  if (!animate || !total || matchMedia('(prefers-reduced-motion: reduce)').matches) { paint(ctx, size, strokes); return; }
  const t0 = performance.now(), dur = Math.min(2600, 600 + total * 2);
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); paint(ctx, size, strokes, Math.ceil(total * k)); if (k < 1 && cv.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const pad = { strokes: [], color: '#111111', width: 12, cur: null, key: null };
function mountPad(key) {
  const cv = $('#padCanvas');
  if (!cv) return;
  if (pad.key !== key) {
    pad.key = key;
    const saved = draft && draft.key === key ? draft.v : null;
    pad.strokes = Array.isArray(saved) ? saved : [];
  }
  const dpr = Math.min(2, devicePixelRatio || 1), size = Math.round(cv.clientWidth * dpr);
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const redraw = () => paint(ctx, size, pad.strokes.concat(pad.cur ? [pad.cur] : []));
  redraw();
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width) * 1000), Math.round(((e.clientY - r.top) / r.height) * 1000)]; };
  cv.onpointerdown = (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* нет */ } const [x, y] = pos(e); pad.cur = { c: pad.color, w: pad.width, p: [x, y] }; redraw(); };
  cv.onpointermove = (e) => {
    if (!pad.cur) return;
    const [x, y] = pos(e), p = pad.cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
    if (Math.hypot(x - lx, y - ly) < 4) return;
    p.push(x, y);
    // дорисовываем только новый кусок
    const k = size / 1000;
    ctx.strokeStyle = pad.cur.c; ctx.lineWidth = pad.cur.w * k; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lx * k, ly * k); ctx.lineTo(x * k, y * k); ctx.stroke();
  };
  const end = () => { if (!pad.cur) return; pad.strokes.push(pad.cur); pad.cur = null; redraw(); saveDraft(key, pad.strokes); };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onpointerleave = end;
  pad.redraw = redraw;
}
function toolsHtml() {
  return `<div class="tools">
    <div class="palette">${COLORS.map((c) => `<button data-col="${c}" class="${pad.color === c ? 'on' : ''}" style="background:${c}${c === '#ffffff' ? ';box-shadow:inset 0 0 0 1px #0004' : ''}" aria-label="Цвет"></button>`).join('')}</div>
    <div class="toolrow">${WIDTHS.map((w, i) => `<button data-wid="${w}" class="${pad.width === w ? 'on' : ''}">${['•', '●', '⬤'][i]}</button>`).join('')}

// ================= Отрисовка =================
let prevStep = '';
function stateArrived() {
  const P = app.P;
  if (P) {
    const fresh = (P.ev || []).filter((e) => e.id > app.evLast);
    if (app.evLast === 0 && !app.started) app.evLast = P.ev?.length ? P.ev[P.ev.length - 1].id : 0;
    else for (const e of fresh) {
      if (e.k === 'reveal') { sfx.reveal(); if (e.smash) setTimeout(() => confetti(180), 900); }
      if (e.k === 'end') { sfx.win(); confetti(260); setTimeout(() => confetti(160), 900); }
      if (e.k === 'step') navigator.vibrate?.(80);
    }
    app.started = true;
    if (fresh.length) app.evLast = fresh[fresh.length - 1].id;
    const sk = P.ph + P.step + (P.w?.qi ?? '') + (P.f?.r ?? '') + (P.i?.r ?? '');
    if (sk !== prevStep) { prevStep = sk; app.sel = {}; }
  }
  render();
}
function render(force) {
  renderTop();
  renderMain(force);
  if (app.sheet) renderSheet();
}
function secsLeft() { const P = app.P; return P?.dl ? Math.max(0, Math.ceil((P.dl - (Date.now() + app.offset)) / 1000)) : 0; }
let total = { key: null, ms: 1 };
setInterval(() => {
  const P = app.P, el = $('#timeFill'), tx = $('#timeTxt');
  if (!el || !P?.dl) return;
  const left = Math.max(0, P.dl - (Date.now() + app.offset));
  if (total.key !== P.dl) total = { key: P.dl, ms: Math.max(1000, left) };
  el.style.width = (100 * left / total.ms) + '%';
  el.classList.toggle('warn', left < 10000);
  const s = Math.ceil(left / 1000);
  if (tx) tx.textContent = s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : s + ' с';
  if (left < 5500 && left > 0 && s !== total.lastS) { total.lastS = s; sfx.tick(); }
}, 200);

function doneMap(v) {
  if (v.ph !== 'game') return {};
  if (MODE === 'who' && v.step === 'vote') return Object.fromEntries(Object.keys(v.w.votes).map((n) => [n, 1]));
  if (MODE === 'funny' && v.step === 'write') return Object.fromEntries(Object.keys(v.f.answers).map((n) => [n, 1]));
  if (MODE === 'funny' && v.step === 'vote') return Object.fromEntries(Object.keys(v.f.votes).map((n) => [n, 1]));
  if (MODE === 'draw' && /^s\d$/.test(v.step)) return v.d.done;
  if (MODE === 'idea' && v.step === 'write') return Object.fromEntries(Object.keys(v.i.ideas).map((n) => [n, 1]));
  if (MODE === 'idea' && v.step === 'guess') return v.i.sent;
  return {};
}
function renderTop() {
  const v = V(), top = $('#top');
  if (!v || v.ph === 'lobby' || !myName() && !isHost()) { top.hidden = true; return; }
  top.hidden = false;
  const done = doneMap(v), me = myName();
  const html = `<div class="toprow"><span class="t">${GAME.emo} ${esc(GAME.name)}</span><span class="time" id="timeTxt">${v.dl ? secsLeft() + ' с' : ''}</span><button id="menuBtn" aria-label="Меню">⋯</button></div>
    ${v.dl ? '<div class="bar"><i id="timeFill"></i></div>' : ''}
    <div class="chips">${v.players.map((n) => `<div class="chip ${done[n] ? 'done' : ''} ${!v.pl[n].on ? 'off' : ''}"><span class="n"><span class="dot" style="background:${PCOLORS[n]}"></span>${esc(n)}${n === me ? ' (ты)' : ''}${done[n] ? ' ✓' : ''}</span><span class="s">${v.scores[n] ?? 0}</span></div>`).join('')}</div>`;
  if (top.dataset.h !== html) { top.innerHTML = html; top.dataset.h = html; $('#menuBtn').onclick = () => openSheet({ k: 'menu' }); }

function renderMain(force) {
  const v = V(), main = $('#main');
  let key, html;
  if (!app.mode) { key = 'menu' + !!app.room; html = viewMenu(); }
  else if (!v) { key = 'wait' + app.hostSeen; html = viewWait(); }
  else {
    const me = myName();
    const rq = isHost() && v.rq?.length ? v.rq : null;
    const pending = app.mode === 'client' && v.rq?.some((r) => r[1] === app.myPeer);
    const { now, ...rest } = v;
    key = JSON.stringify([rest, me, app.sel, pending]);
    // пока игрок рисует или пишет, экран не перерисовываем (чужие «готово» видны вверху)
    const busyInput = v.ph === 'game' && me && v.players.includes(me) && (
      (MODE === 'draw' && /^s\d$/.test(v.step) && !v.d.done[me]) ||
      (MODE === 'funny' && v.step === 'write' && v.f.answers[me] == null) ||
      (MODE === 'idea' && v.step === 'write' && v.i.ideas[me] == null));
    if (busyInput && !rq) key = JSON.stringify(['input', v.step, v.f?.r, v.i?.r, me, pending]);
    html = (rq ? requestsHtml(rq) : '') + (pending ? viewPending() : (!me && app.mode === 'client') || (v.ph === 'lobby' && !me) ? viewChoose(v) : v.ph === 'lobby' ? viewLobby(v) : v.ph === 'end' ? viewEnd(v, me) : viewGame(v, me));

  const stepKey = v ? JSON.stringify([v.ph, v.step, v.w?.qi, v.f?.r, v.d?.rv, v.i?.r, !!myName()]) : 'x';
  main.classList.toggle('noanim', stepKey === app.lastStepKey);

  const el = fid && document.getElementById(fid);
  if (el && 'value' in el) { if (fval && !el.value) el.value = fval; el.focus(); }
}

      if (!inGame) return head + '<p class="status">Все пишут ответы…</p>';
      if (f.answers[me] != null) return head + `<div class="ans" style="opacity:.8">${esc(f.answers[me])}</div>` + waitHtml(v, 'Ответ принят');
      return head + `<textarea id="ansIn" maxlength="120" placeholder="Твой самый смешной вариант…">${esc(draft && draft.key === 'f' + f.r ? draft.v : '')}</textarea><div class="count" id="ansCnt">0 / 120</div><button class="btn" data-a="sendAns">Отправить ответ</button>`;
    }
    if (v.step === 'vote') {
      if (!inGame) return head + '<p class="status">Голосуют…</p>';
      const voted = f.votes[me];
      return head + `<p class="status">${voted ? 'Голос принят ✓' : 'Какой ответ самый смешной?'}</p>
        <div class="answers">${f.order.map((a, i) => `<button class="ans ${a === me ? 'mine' : ''} ${voted === a ? 'sel' : ''}" style="animation-delay:${i * 0.08}s" ${a === me || voted ? 'disabled' : ''} data-fvote="${esc(a)}">${esc(f.answers[a])}${a === me ? '<div class="meta"><span>это твой ответ</span></div>' : ''}</button>`).join('')}</div>
        ${voted ? waitHtml(v, '') : ''}`;
    }
    if (v.step === 'reveal') {
      const r = f.res;
      if (r.empty) return head + '<p class="status">Слишком мало ответов в этом раунде 🤷</p>' + hostNext();
      const order = f.order.slice().sort((a, b) => (r.cnt[b] || 0) - (r.cnt[a] || 0));
      return head + `<div class="answers">${order.map((a, i) => `<div class="ans" style="animation-delay:${i * 0.15}s">${r.smash === a ? '<span class="smash">РАЗНОС! +200</span>' : ''}${esc(f.answers[a])}
        <div class="meta"><span style="color:${PCOLORS[a]}">— ${esc(a)} ${Object.keys(r.votes).filter((x) => r.votes[x] === a).map((x) => `<span class="dot" style="background:${PCOLORS[x]}"></span>`).join(' ')}</span><span class="pts">+${r.pts[a] || 0}</span></div></div>`).join('')}</div>
        ${hostNext(f.r + 1 >= f.qs.length ? 'К итогам 🏆' : 'Следующий раунд ➜')}`;
    }
  }
  if (MODE === 'draw') {
    const d = v.d;
    if (/^s\d$/.test(v.step)) {
      const s = Number(v.step[1]);
      const stepName = ['', 'Рисуем слово', 'Что на рисунке?', 'Рисуем описание', 'Что на рисунке?'][s];
      const head = `<p class="sub">Этап ${s} из 4 · ${stepName}</p>`;
      if (!inGame) return head + '<p class="status">Игроки заняты…</p>';
      const i = v.players.indexOf(me), N = v.players.length, k = ((i - s) % N + N) % N, prev = d.chains[k][s - 1];
      if (d.done[me]) return head + waitHtml(v, s % 2 ? 'Рисунок отправлен' : 'Описание отправлено');
      if (s % 2) {
        return head + `<div class="task"><small>${s === 1 ? 'Твоё слово' : 'Нарисуй, что описал игрок'}</small><span>«${esc(prev.v)}»</span></div>
          <div class="pad"><canvas id="padCanvas"></canvas></div>${toolsHtml()}
          <button class="btn" data-a="sendDraw">Готово, отправить</button>`;
      }
      return head + `<div class="task"><small>Опиши, что нарисовано</small></div><canvas class="view" style="width:100%;aspect-ratio:1;background:#fff;border-radius:16px;display:block" data-prev="1"></canvas>
        <input id="descIn" maxlength="100" placeholder="Это…" autocomplete="off" value="${esc(draft && draft.key === 'd' + s ? draft.v : '')}"><button class="btn" data-a="sendDesc">Отправить</button>`;
    }
    if (v.step === 'reveal') {
      const rv = d.rv, chain = d.chains[rv.k];
      const items = chain.slice(0, rv.s + 1).map((it, s) => {
        const liked = (d.likes[rv.k + ':' + s] || []);
        const canLike = s > 0 && me && it.by !== me && v.players.includes(me);
        const body = it.t === 'word' ? `<div class="word">«${esc(it.v)}»</div>` : it.t === 'draw' ? `<canvas class="view" data-strokes="${rv.k}:${s}" data-anim="${s === rv.s ? 1 : 0}"></canvas>` : `<div class="txt">«${esc(it.v)}»</div>`;
        const label = ['📝 слово', '🎨 рисунок', '💬 «это…»', '🎨 рисунок', '💬 «это…»'][s];
        return `<div class="citem" ${s === rv.s ? 'id="lastItem"' : 'style="animation:none"'}><div class="who"><span class="dot" style="background:${PCOLORS[it.by]}"></span>${esc(it.by)} · ${label}</div>${body}
          ${s > 0 ? `<button class="like ${liked.includes(me) ? 'on' : ''}" ${canLike && !liked.includes(me) ? '' : 'disabled'} data-like="${rv.k}:${s}">❤️ ${liked.length}</button>` : ''}</div>`;
      }).join('');
      const last = rv.k + 1 >= d.chains.length && rv.s >= 4;
      return `<p class="sub">Цепочка ${rv.k + 1} из ${d.chains.length} · начал(а) <b style="color:${PCOLORS[chain[0].by]}">${esc(chain[0].by)}</b></p><div class="chain">${items}</div>
        ${hostNext(last ? 'К итогам 🏆' : rv.s >= 4 ? 'Следующая цепочка ➜' : 'Показать дальше ➜')}`;
    }
  }
  if (MODE === 'idea') {
    const it = v.i, theme = IDEA_T[it.ts[it.r]];
    const head = `<div class="qcard"><div class="lbl">Раунд ${it.r + 1} из ${it.ts.length} · тема</div><div class="q">${esc(theme)}</div></div>`;
    if (v.step === 'write') {
      if (!inGame) return head + '<p class="status">Все придумывают картинки…</p>';
      if (it.ideas[me] != null) return head + `<div class="ans" style="opacity:.85">${esc(it.ideas[me])}</div>` + waitHtml(v, 'Описание принято');
      return head + `<p class="note" style="text-align:center">Опиши картинку, которую нарисует нейросеть. Чем безумнее и подробнее, тем смешнее. Не пиши своё имя 😉</p>
        <textarea id="ideaIn" maxlength="200" placeholder="Например: Марина в короне верхом на Bratwurst, вокруг фейерверк…">${esc(draft && draft.key === 'i' + it.r ? draft.v : '')}</textarea><div class="count" id="ideaCnt">0 / 200</div>
        <button class="btn" data-a="sendIdea">Отправить</button>`;
    }
    if (v.step === 'gen') {
      const ready = it.order.filter((a) => it.imgs[a]).length;
      return head + `<div class="emo-big" style="animation:pop 1s infinite alternate">🎨</div><p class="status">Grok рисует картинки… ${ready} из ${it.order.length}</p><p class="note" style="text-align:center">Обычно это занимает 10–30 секунд</p>${isHost() ? '<button class="btn ghost" data-a="skip">Не ждать</button>' : ''}`;
    }
    if (v.step === 'guess') {
      if (!inGame) return head + '<p class="status">Игроки угадывают…</p>';
      if (it.sent[me]) return head + waitHtml(v, 'Ответы приняты');
      const need = it.order.map((a, s) => s).filter((s) => it.order[s] !== me);
      const picked = need.filter((s) => app.sel[s]).length;
      return head + `<p class="status">Чья это фантазия?</p><div class="chain">${it.order.map((a, s) => ideaCard(v, s, false)).join('')}</div>
        <button class="btn" data-a="sendGuess">${picked < need.length ? `Готово (${picked} из ${need.length})` : 'Готово ✓'}</button>`;
    }
    if (v.step === 'reveal') {
      if (it.res?.empty) return head + '<p class="status">В этом раунде никто ничего не придумал 🤷</p>' + hostNext();
      return head + `<div class="chain">${it.order.map((a, s) => ideaCard(v, s, true)).join('')}</div>${hostNext(it.r + 1 >= it.ts.length ? 'К итогам 🏆' : 'Следующий раунд ➜')}`;
    }
  }
  return '<p class="status">…</p>';
}
function ideaPic(v, a) {
  const url = v.i.imgs[a];
  if (url && /^https:\/\//.test(url)) return `<img class="view" style="object-fit:cover" src="${esc(url)}" alt="Картинка" loading="eager">`;
  if (url === 'no') return `<div class="txt" style="font-size:16px;color:var(--muted)">🙈 Нейросеть отказалась это рисовать</div>`;
  return '';
}
function ideaCard(v, s, reveal) {
  const it = v.i, a = it.order[s], me = myName(), pic = ideaPic(v, a);
  const textOnly = !pic || it.imgs[a] === 'skip';
  const body = (pic || '') + (reveal || textOnly || it.imgs[a] === 'no' ? `<div class="txt" style="font-size:18px">«${esc(it.ideas[a])}»</div>` : '');
  if (!reveal) {
    const own = a === me;
    return `<div class="citem" style="animation-delay:${s * 0.1}s">${body}${own ? '<p class="note" style="text-align:center">Это твоя картинка 😎</p>'
      : `<div class="opts">${v.players.filter((n) => n !== me).map((n) => `<button data-guess="${s}:${esc(n)}" class="${app.sel[s] === n ? 'on' : ''}" style="${app.sel[s] === n ? `background:${PCOLORS[n]};color:#fff` : ''}">${esc(n)}</button>`).join('')}</div>`}</div>`;
  }
  const right = it.res?.right?.[s] || [], likes = it.likes?.[s] || [];
  const canLike = me && a !== me && v.players.includes(me) && v.step === 'reveal' && !likes.includes(me);
  return `<div class="citem" style="animation-delay:${s * 0.15}s"><div class="who"><span class="dot" style="background:${PCOLORS[a]}"></span>Автор: <b style="color:${PCOLORS[a]}">${esc(a)}</b></div>${body}
    <p class="note" style="text-align:center">${right.length ? 'Угадали: ' + right.map((n) => `<b style="color:${PCOLORS[n]}">${esc(n)}</b>`).join(', ') + ' (+100)' : 'Никто не угадал'}</p>
    ${v.step === 'reveal' ? `<button class="like ${likes.includes(me) ? 'on' : ''}" ${canLike ? '' : 'disabled'} data-ilike="${s}">❤️ ${likes.length}</button>` : ''}</div>`;
}

// ---------- Меню ----------
function openSheet(s) { app.sheet = s; renderSheet(); }
function closeSheet() { app.sheet = null; $('#sheetWrap').hidden = true; }
function renderSheet() {
  const s = app.sheet, v = V();
  if (!s) return;
  let html = '<button class="btn ghost" style="justify-self:end;width:auto;padding:6px 12px" data-close="1">Закрыть ✕</button>';
  if (s.k === 'menu') {
    html += `<h2>${GAME.emo} ${esc(GAME.name)}</h2>${app.code ? `<p class="sub">Игра ${esc(app.code)}${myName() ? ' · ты: ' + esc(myName()) : ''}</p>` : ''}
      ${isHost() && v?.ph === 'game' ? '<button class="btn sec" data-a="endNow">Закончить игру сейчас</button>' : ''}
      ${isHost() ? `<div class="panel">${inviteHtml()}</div>` : ''}
      ${rulesHtml()}
      <a class="btn ghost" style="text-align:center;text-decoration:none;display:block" href="../">Все игры</a>
      <button class="btn ghost" data-a="exit">Выйти в меню игры</button>`;
  }
  $('#sheet').innerHTML = html;
  $('#sheetWrap').hidden = false;
  bindCommon($('#sheet'));
  $('#sheet').querySelectorAll('[data-close]').forEach((b) => b.onclick = closeSheet);
}
$('#sheetWrap').addEventListener('click', (e) => { if (e.target.id === 'sheetWrap') closeSheet(); });

// ---------- Обработчики ----------
const armed = {};
function confirmTwice(id, btn, label, fn) {
  if (armed[id]) { armed[id] = false; fn(); return; }
  armed[id] = true; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { armed[id] = false; if (btn.isConnected) btn.textContent = old; }, 3000);
}
const actions = {
  host: () => { store.del('host'); hostOnline(null); },
  resume: () => hostOnline(store.get('host')),
  join: () => joinOnline($('#code').value),
  exit: () => { closeSheet(); exitToMenu(); },
  copy: () => { const i = $('#invite'); navigator.clipboard?.writeText(i.value).then(() => toast('Ссылка скопирована'), () => { i.select(); toast('Выдели и скопируй ссылку'); }); },
  share: () => { if (navigator.share) navigator.share({ title: GAME.name, text: 'Заходи играть!', url: inviteUrl() }).catch(() => {}); else { $('#invite').select(); toast('Скопируй ссылку и отправь'); } },
  start: () => act('start', { [OPTS.key]: app.opt ?? OPTS.def }),
  again: () => act('start', { [OPTS.key]: app.opt ?? OPTS.def }),
  lobby: () => act('lobby'),
  next: () => act('next'),
  skip: () => act('skip'),
  endNow: (b) => confirmTwice('end', b, 'Точно? Нажми ещё раз', () => { app.game?.finish(); closeSheet(); }),
  sendAns: () => { const t = $('#ansIn').value.trim(); if (!t) return toast('Напиши ответ'); sfx.done(); act('answer', t); },
  sendIdea: () => { const t = $('#ideaIn').value.trim(); if (!t) return toast('Опиши картинку'); sfx.done(); act('idea', t); },
  sendGuess: () => { sfx.done(); act('iguess', app.sel); },
  saveKey: () => { const k = $('#keyIn').value.trim(); if (!/^xai-/.test(k)) return toast('Ключ начинается с xai-'); try { localStorage.setItem(KEY_STORE, k); } catch (e) { return toast('Браузер не даёт сохранить ключ'); } toast('Ключ сохранён на этом телефоне'); renderMain(true); },
  delKey: () => { try { localStorage.removeItem(KEY_STORE); } catch (e) { /* нет */ } toast('Ключ удалён'); renderMain(true); },
  sendDesc: () => { const t = $('#descIn').value.trim(); if (!t) return toast('Напиши, что нарисовано'); sfx.done(); act('submit', t); },
  sendDraw: (b) => {
    if (!pad.strokes.length) return confirmTwice('emptyDraw', b, 'Рисунок пустой. Отправить всё равно?', () => act('submit', []));
    sfx.done(); act('submit', pad.strokes);
  },
};
function bindCommon(root) { root.querySelectorAll('[data-a]').forEach((b) => { const h = actions[b.dataset.a]; if (h) b.onclick = () => h(b); }); }
function bindMain() {
  const m = $('#main'), v = V();
  bindCommon(m);
  m.querySelectorAll('[data-join]').forEach((b) => b.onclick = () => { app.me = b.dataset.join; if (app.mode === 'client') { store.set('client', { code: app.code, me: app.me, at: Date.now() }); app.joinTried = true; } act('join', app.me); });
  m.querySelectorAll('[data-appr]').forEach((b) => b.onclick = () => act('approve', b.dataset.appr));
  m.querySelectorAll('[data-deny]').forEach((b) => b.onclick = () => act('deny', b.dataset.deny));
  m.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => { app.opt = Number(b.dataset.opt); renderMain(true); });
  m.querySelectorAll('[data-vote]').forEach((b) => b.onclick = () => { sfx.tap(); act('vote', b.dataset.vote); });
  m.querySelectorAll('[data-fvote]').forEach((b) => b.onclick = () => { sfx.tap(); act('fvote', b.dataset.fvote); });
  m.querySelectorAll('[data-guess]').forEach((b) => b.onclick = () => { const [s, n] = b.dataset.guess.split(':'); app.sel = { ...app.sel, [s]: n }; saveDraft('g' + v.i.r, app.sel); sfx.tap(); renderMain(true); });
  m.querySelectorAll('[data-ilike]').forEach((b) => b.onclick = () => { sfx.tap(); act('ilike', Number(b.dataset.ilike)); });
  const idea = $('#ideaIn');
  if (idea && v) { const upd = () => { $('#ideaCnt').textContent = idea.value.length + ' / 200'; saveDraft('i' + v.i.r, idea.value); }; idea.oninput = upd; upd(); }
  m.querySelectorAll('[data-like]').forEach((b) => b.onclick = () => { const [k, s] = b.dataset.like.split(':').map(Number); sfx.tap(); act('like', { k, s }); });
  m.querySelectorAll('[data-col]').forEach((b) => b.onclick = () => { pad.color = b.dataset.col; m.querySelectorAll('[data-col]').forEach((x) => x.classList.toggle('on', x === b)); });
  m.querySelectorAll('[data-wid]').forEach((b) => b.onclick = () => { pad.width = Number(b.dataset.wid); m.querySelectorAll('[data-wid]').forEach((x) => x.classList.toggle('on', x === b)); });
  m.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => {
    if (b.dataset.tool === 'undo') { pad.strokes.pop(); pad.redraw?.(); saveDraft(pad.key, pad.strokes); }
    else confirmTwice('clear', b, 'Ещё раз', () => { pad.strokes = []; pad.redraw?.(); saveDraft(pad.key, pad.strokes); });
  });
  // полосы результатов растут после появления
  requestAnimationFrame(() => m.querySelectorAll('.rfill').forEach((el) => { el.style.width = el.dataset.w + '%'; }));
  // ввод ответа: счётчик и черновик
  const ans = $('#ansIn');
  if (ans && v) { const upd = () => { $('#ansCnt').textContent = ans.value.length + ' / 120'; saveDraft('f' + v.f.r, ans.value); }; ans.oninput = upd; upd(); }
  const desc = $('#descIn');
  if (desc && v) { desc.oninput = () => saveDraft(v.step.replace('s', 'd'), desc.value); desc.onkeydown = (e) => { if (e.key === 'Enter') actions.sendDesc(); }; }
  // холст рисования и просмотр рисунков
  if ($('#padCanvas') && v) mountPad('d' + v.step[1]);
  if (v && MODE === 'draw' && v.d) {
    const prevCv = m.querySelector('[data-prev]');
    if (prevCv) { const me = myName(), s = Number(v.step[1]), N = v.players.length, i = v.players.indexOf(me), k = ((i - s) % N + N) % N; showDrawing(prevCv, v.d.chains[k][s - 1].v, false); }
    m.querySelectorAll('[data-strokes]').forEach((cv) => { const [k, s] = cv.dataset.strokes.split(':').map(Number); showDrawing(cv, v.d.chains[k][s].v, cv.dataset.anim === '1'); });
    const last = $('#lastItem'); if (last && v.step === 'reveal') last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const code = $('#code'); if (code) code.onkeydown = (e) => { if (e.key === 'Enter') joinOnline(code.value); };
}

// ---------- Запуск ----------
(function boot() {
  const m = /^#g(\d{4,6})$/.exec(location.hash);
  if (m) app.hashCode = m[1];
  renderMain(true);
  initRoom().then(() => {
    const cs = store.get('client');
    if (cs && cs.me && (!app.hashCode || cs.code === app.hashCode) && Date.now() - cs.at < 12 * 3600e3) app.me = cs.me;
    if (!app.mode && app.room && app.hashCode) { const hs = store.get('host'); if (hs && hs.code === app.hashCode) hostOnline(hs); else joinOnline(app.hashCode); }
  });
})();
</script>

</body>
</html>
